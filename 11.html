<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>PNG 伪装 TS · HLS 播放器</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #07090e;
    color: #e9edf5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
}

body {
    min-height: 100vh;
}

.container {
    width: min(920px, calc(100% - 24px));
    margin: 20px auto 60px;
}

.header {
    padding: 22px;
    border-radius: 22px;
    background:
        linear-gradient(
            145deg,
            #141a27,
            #0e121b
        );
    border: 1px solid #252c3a;
    box-shadow: 0 15px 45px rgba(0,0,0,.35);
    margin-bottom: 18px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

.header p {
    margin: 0;
    color: #929bad;
    font-size: 14px;
    line-height: 1.7;
}

.card {
    background: #111620;
    border: 1px solid #252c3a;
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
}

label {
    display: block;
    margin-bottom: 8px;
    color: #aeb7c8;
    font-size: 14px;
}

input {
    width: 100%;
    height: 48px;
    padding: 0 15px;
    border-radius: 13px;
    border: 1px solid #303848;
    outline: none;
    background: #090c12;
    color: #fff;
    font-size: 14px;
}

input:focus {
    border-color: #6b8cff;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 13px 20px;
    background: #2a3243;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
}

button.primary {
    background: #596fff;
}

button.danger {
    background: #8f3343;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.video-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}

.aliyun-player {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
    display: none;
    z-index: 30;
}

.loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(5px);
    pointer-events: none;
    opacity: 0;
    transition: .25s;
    z-index: 20;
}

.loading.show {
    opacity: 1;
}

.spinner {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 5px solid rgba(255,255,255,.18);
    border-top-color: #fff;
    animation: spin .8s linear infinite;
    margin-bottom: 14px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-text {
    font-size: 16px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: #090c12;
    border-radius: 15px;
    padding: 15px;
}

.stat-title {
    color: #818a9c;
    font-size: 13px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 22px;
    font-weight: 600;
}

.progress {
    height: 8px;
    background: #292f3c;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #6578ff;
    transition: width .2s;
}

.status {
    margin-top: 12px;
    display: inline-block;
    padding: 8px 13px;
    border-radius: 99px;
    background: #20283a;
    color: #b9c3d7;
    font-size: 13px;
}

.log-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.log-title h2 {
    margin: 0;
    font-size: 20px;
}

.badge {
    padding: 7px 12px;
    border-radius: 99px;
    background: #222a3b;
    color: #b8c2d6;
    font-size: 13px;
}

.log {
    height: 400px;
    overflow-y: auto;
    padding: 17px;
    background: #05070b;
    border-radius: 16px;
    font-family:
        "Consolas",
        "Courier New",
        monospace;
    font-size: 13px;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
}

.log-line {
    margin-bottom: 3px;
}

.log-info {
    color: #91d9ff;
}

.log-ok {
    color: #79e3a3;
}

.log-warn {
    color: #ffd479;
}

.log-error {
    color: #ff7886;
}

.log-url {
    color: #c6b8ff;
}

.log-dim {
    color: #788397;
}

.clear {
    width: 100%;
    margin-top: 12px;
}

.notice {
    margin-top: 13px;
    padding: 13px 15px;
    border-radius: 13px;
    background: #171d2a;
    color: #aeb8c9;
    font-size: 13px;
    line-height: 1.7;
}

@media(max-width:650px) {

    .container {
        width: calc(100% - 16px);
        margin-top: 10px;
    }

    .card {
        padding: 14px;
        border-radius: 18px;
    }

    .header {
        padding: 17px;
        border-radius: 18px;
    }

    .header h1 {
        font-size: 21px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .log {
        height: 420px;
        font-size: 12px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="header">

    <h1>
        PNG 伪装 TS · HLS 播放器
    </h1>

    <p>
        原生 H5 → hls.js 默认 Loader → 阿里云 H5 诊断
    </p>

</div>


<div class="card">

    <label>
        M3U8 地址
    </label>

    <input
        id="m3u8Input"
        type="text"
        placeholder="请输入 M3U8 地址"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
    >

    <div class="buttons">

        <button
            id="startBtn"
            class="primary"
            onclick="startPlayer()">

            ▶ 开始播放

        </button>

        <button
            onclick="stopPlayer()">

            ■ 停止

        </button>

        <button
            onclick="openAliyunPlayer()">

            阿里云 H5

        </button>

    </div>

    <div class="notice">

        M3U8 解析：

        <b>过滤前 5 行</b>，

        从第 6 行开始寻找

        <b>EXTINF + 下一行媒体地址</b>。

        <br>

        播放流程：

        <b>
            原生 H5 → hls.js 默认 Loader → 阿里云 H5
        </b>

        <br>

        hls.js 不再使用自定义 Loader，
        避免与新版 hls.js Loader API 冲突。

    </div>

</div>


<div class="card">

    <div class="video-box">

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline
            preload="metadata">
        </video>

        <iframe
            id="aliyunPlayer"
            class="aliyun-player"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>

        <div
            id="loading"
            class="loading">

            <div class="spinner"></div>

            <div
                id="loadingText"
                class="loading-text">

                正在加载...

            </div>

        </div>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                M3U8 分片
            </div>

            <div
                id="total"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                成功读取
            </div>

            <div
                id="success"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                跳过
            </div>

            <div
                id="failed"
                class="stat-value">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                当前分片
            </div>

            <div
                id="current"
                class="stat-value">
                -
            </div>

        </div>

    </div>


    <div
        id="status"
        class="status">

        等待播放

    </div>


    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar">
        </div>

    </div>

</div>


<div class="card">

    <div class="log-title">

        <h2>
            运行日志
        </h2>

        <div class="badge">
            H5 → hls.js → Aliyun
        </div>

    </div>


    <div
        id="log"
        class="log">
    </div>


    <button
        class="clear"
        onclick="clearLog()">

        清空日志

    </button>

</div>

</div>


<script>

/* =========================================================
   全局
========================================================= */

let hls = null;

let currentObjectURL = null;

let segments = [];

let successfulSegments = 0;

let failedSegments = 0;

let currentSegment = 0;

let originalM3U8URL = "";

let playerMode = "";

let fallbackStarted = false;

let nativeTimer = null;

let hlsStarted = false;

let aliyunStarted = false;


/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById("video");

const input =
    document.getElementById("m3u8Input");

const iframe =
    document.getElementById("aliyunPlayer");


/* =========================================================
   日志
========================================================= */

function log(message, type = "info") {

    const box =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    const line =
        document.createElement("div");

    line.className =
        "log-line log-" + type;

    line.textContent =
        `[${time}] ${message}`;

    box.appendChild(line);

    box.scrollTop =
        box.scrollHeight;
}


function clearLog() {

    document.getElementById("log")
        .innerHTML = "";
}


/* =========================================================
   UI
========================================================= */

function setLoading(show, text) {

    const loading =
        document.getElementById("loading");

    const loadingText =
        document.getElementById("loadingText");

    loading.classList.toggle(
        "show",
        !!show
    );

    if (text) {

        loadingText.textContent =
            text;
    }
}


function setStatus(text) {

    document.getElementById("status")
        .textContent = text;
}


function updateStats() {

    document.getElementById("total")
        .textContent =
        segments.length;

    document.getElementById("success")
        .textContent =
        successfulSegments;

    document.getElementById("failed")
        .textContent =
        failedSegments;

    document.getElementById("current")
        .textContent =
        currentSegment || "-";


    const done =
        successfulSegments +
        failedSegments;


    const percent =
        segments.length
            ? done / segments.length * 100
            : 0;


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";
}


/* =========================================================
   隐藏阿里云
========================================================= */

function hideAliyunPlayer() {

    iframe.style.display =
        "none";

    iframe.src =
        "about:blank";
}


/* =========================================================
   停止 hls
========================================================= */

function destroyHLS() {

    if (hls) {

        try {

            hls.stopLoad();

        } catch(e) {}

        try {

            hls.detachMedia();

        } catch(e) {}

        try {

            hls.destroy();

        } catch(e) {}

        hls = null;
    }

    hlsStarted = false;
}


/* =========================================================
   停止播放器
========================================================= */

function stopPlayer() {

    fallbackStarted = false;

    aliyunStarted = false;

    playerMode = "";

    if (nativeTimer) {

        clearTimeout(nativeTimer);

        nativeTimer = null;
    }


    destroyHLS();


    try {

        video.pause();

        video.removeAttribute("src");

        video.load();

    } catch(e) {}


    hideAliyunPlayer();


    if (currentObjectURL) {

        try {

            URL.revokeObjectURL(
                currentObjectURL
            );

        } catch(e) {}

        currentObjectURL = null;
    }


    setLoading(false);

    setStatus("已停止");

    log(
        "播放器已停止",
        "warn"
    );
}


/* =========================================================
   M3U8 获取
========================================================= */

async function getM3U8(url) {

    log(
        "正在读取 M3U8...",
        "info"
    );


    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `M3U8 HTTP ${response.status}`
        );
    }


    const text =
        await response.text();


    log(
        `M3U8 获取成功：${text.length} 字符`,
        "ok"
    );


    return text;
}


/* =========================================================
   URL 转绝对地址
========================================================= */

function resolveURL(
    baseURL,
    segmentURL
) {

    try {

        return new URL(
            segmentURL,
            baseURL
        ).href;

    } catch(e) {

        return segmentURL;
    }
}


/* =========================================================
   M3U8 解析
========================================================= */

function parseM3U8(
    text,
    baseURL
) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                x => x.trim()
            );


    segments = [];


    log(
        `M3U8 共 ${lines.length} 行`,
        "info"
    );


    /*
       保留你的原始规则：

       前5行跳过
    */

    let i = 5;


    while (
        i < lines.length
    ) {

        const line =
            lines[i];


        if (
            line ===
            "#EXT-X-ENDLIST"
        ) {

            log(
                "发现 #EXT-X-ENDLIST，停止解析",
                "ok"
            );

            break;
        }


        if (!line) {

            i++;

            continue;
        }


        if (
            !line.startsWith(
                "#EXTINF:"
            )
        ) {

            log(
                `第 ${i + 1} 行不是 EXTINF，跳过`,
                "warn"
            );

            i++;

            continue;
        }


        const rawURL =
            lines[i + 1];


        if (
            !rawURL ||
            rawURL.startsWith("#")
        ) {

            log(
                `第 ${i + 2} 行没有找到媒体地址`,
                "warn"
            );

            i += 2;

            continue;
        }


        let duration =
            line
                .substring(8)
                .replace(",", "")
                .trim();


        duration =
            parseFloat(
                duration
            );


        if (
            Number.isNaN(
                duration
            )
        ) {

            duration = 0;
        }


        const absoluteURL =
            resolveURL(
                baseURL,
                rawURL
            );


        segments.push({

            number:
                segments.length + 1,

            duration:
                duration,

            url:
                absoluteURL
        });


        log(
            `分片 ${segments.length}：${absoluteURL}`,
            "url"
        );


        i += 2;
    }


    updateStats();


    log(
        `✓ 找到 ${segments.length} 个分片`,
        "ok"
    );


    return segments;
}


/* =========================================================
   创建虚拟 M3U8
========================================================= */

function createVirtualM3U8() {

    let result =
        "#EXTM3U\n";

    result +=
        "#EXT-X-VERSION:3\n";

    result +=
        "#EXT-X-TARGETDURATION:20\n";

    result +=
        "#EXT-X-MEDIA-SEQUENCE:0\n";


    for (
        const segment of segments
    ) {

        let duration =
            Number(segment.duration);


        if (
            !Number.isFinite(duration) ||
            duration <= 0
        ) {

            duration = 10;
        }


        result +=
            `#EXTINF:${duration.toFixed(3)},\n`;

        result +=
            `${segment.url}\n`;
    }


    result +=
        "#EXT-X-ENDLIST\n";


    return result;
}


/* =========================================================
   创建 Blob M3U8
========================================================= */

function createM3U8Blob() {

    const text =
        createVirtualM3U8();


    log(
        "虚拟 M3U8 内容：",
        "dim"
    );


    log(
        text,
        "dim"
    );


    const blob =
        new Blob(
            [text],
            {
                type:
                    "application/vnd.apple.mpegurl"
            }
        );


    if (currentObjectURL) {

        try {

            URL.revokeObjectURL(
                currentObjectURL
            );

        } catch(e) {}
    }


    currentObjectURL =
        URL.createObjectURL(
            blob
        );


    return currentObjectURL;
}


/* =========================================================
   阿里云地址
========================================================= */

function getAliyunURL(
    source
) {

    return (
        "https://video.aliyuncs.com/player-detection/index.html?source=" +
        encodeURIComponent(source)
    );
}


/* =========================================================
   阿里云播放器
========================================================= */

function openAliyunPlayer() {

    const url =
        input.value.trim();


    if (!url) {

        alert(
            "请先输入 M3U8 地址"
        );

        return;
    }


    originalM3U8URL =
        url;


    destroyHLS();


    try {

        video.pause();

        video.removeAttribute("src");

        video.load();

    } catch(e) {}


    const aliyunURL =
        getAliyunURL(
            url
        );


    log(
        "正在切换到阿里云原生 H5...",
        "warn"
    );


    log(
        `阿里云 Source：${url}`,
        "url"
    );


    iframe.src =
        aliyunURL;

    iframe.style.display =
        "block";


    aliyunStarted = true;

    playerMode =
        "aliyun";


    setLoading(false);

    setStatus(
        "阿里云原生 H5"
    );


    log(
        "✓ 已切换到阿里云播放器诊断页面",
        "ok"
    );
}


/* =========================================================
   原生 H5
========================================================= */

function startNativeH5(
    url
) {

    return new Promise(
        (resolve, reject) => {

            playerMode =
                "native";


            hideAliyunPlayer();


            log(
                "① 开始尝试原生 H5 播放",
                "info"
            );


            let settled = false;


            function cleanup() {

                video.removeEventListener(
                    "playing",
                    onPlaying
                );

                video.removeEventListener(
                    "error",
                    onError
                );

                video.removeEventListener(
                    "loadedmetadata",
                    onMetadata
                );


                if (nativeTimer) {

                    clearTimeout(
                        nativeTimer
                    );

                    nativeTimer = null;
                }
            }


            function success() {

                if (settled) {
                    return;
                }


                settled = true;

                cleanup();


                log(
                    "✓ 原生 H5 已开始播放",
                    "ok"
                );


                setLoading(false);

                setStatus(
                    "原生 H5 播放中"
                );


                resolve();
            }


            function failure(
                reason
            ) {

                if (settled) {
                    return;
                }


                settled = true;

                cleanup();


                log(
                    `原生 H5 播放失败：${reason}`,
                    "warn"
                );


                reject(
                    new Error(reason)
                );
            }


            function onPlaying() {

                success();
            }


            function onMetadata() {

                log(
                    "原生 H5：loadedmetadata",
                    "info"
                );
            }


            function onError() {

                const err =
                    video.error;


                let msg =
                    "Video error";


                if (err) {

                    msg =
                        `Video错误代码 ${err.code}`;
                }


                failure(msg);
            }


            video.addEventListener(
                "playing",
                onPlaying
            );


            video.addEventListener(
                "error",
                onError
            );


            video.addEventListener(
                "loadedmetadata",
                onMetadata
            );


            video.src =
                url;


            video.load();


            const playPromise =
                video.play();


            if (
                playPromise &&
                typeof playPromise.catch ===
                "function"
            ) {

                playPromise.catch(
                    error => {

                        if (
                            error &&
                            error.name ===
                            "NotAllowedError"
                        ) {

                            log(
                                "浏览器阻止自动播放，请点击视频播放按钮",
                                "warn"
                            );

                            /*
                               这里不把
                               NotAllowedError
                               当成媒体格式错误。

                               但是如果8秒后仍没有
                               playing，则进入 hls.js。
                            */

                            return;
                        }


                        failure(
                            error
                                ? error.message
                                : "play()失败"
                        );
                    }
                );
            }


            nativeTimer =
                setTimeout(
                    () => {

                        if (!settled) {

                            failure(
                                "原生 H5 8秒未开始播放"
                            );
                        }

                    },
                    8000
                );
        }
    );
}


/* =========================================================
   hls.js
========================================================= */

function startHLS(
    virtualURL
) {

    if (hlsStarted) {

        log(
            "hls.js 已经启动，忽略重复请求",
            "warn"
        );

        return;
    }


    hlsStarted = true;

    playerMode =
        "hls";


    hideAliyunPlayer();


    destroyHLS();


    if (!window.Hls) {

        throw new Error(
            "hls.js 未加载"
        );
    }


    if (!Hls.isSupported()) {

        throw new Error(
            "当前浏览器不支持 MSE"
        );
    }


    log(
        "✓ 当前浏览器支持 MSE",
        "ok"
    );


    log(
        "使用 hls.js 默认 Loader",
        "info"
    );


    /*
       =====================================================
       重要：

       不再使用 CustomTSLoader。

       直接让 hls.js 默认 Loader：

       Blob M3U8
           ↓
       绝对 PNG/TS URL
           ↓
       Fetch/XHR
           ↓
       ArrayBuffer
           ↓
       TS Demuxer
           ↓
       MSE
    =====================================================
    */

    const config = {

        enableWorker: true,

        lowLatencyMode: false,

        backBufferLength: 60,

        maxBufferLength: 30,

        maxMaxBufferLength: 60,

        manifestLoadingMaxRetry: 2,

        fragLoadingMaxRetry: 3,

        manifestLoadingRetryDelay: 1000,

        fragLoadingRetryDelay: 1000,

        startFragPrefetch: false,

        capLevelToPlayerSize: true
    };


    hls =
        new Hls(config);


    /*
       Video 连接
    */

    hls.attachMedia(
        video
    );


    hls.on(

        Hls.Events.MEDIA_ATTACHED,

        () => {

            log(
                "✓ 视频已连接到 hls.js",
                "ok"
            );


            log(
                "默认 Loader：manifest + fragment",
                "info"
            );


            log(
                "正在加载虚拟 M3U8...",
                "info"
            );


            hls.loadSource(
                virtualURL
            );
        }
    );


    /*
       Manifest loading
    */

    hls.on(

        Hls.Events.MANIFEST_LOADING,

        () => {

            log(
                "正在加载虚拟 M3U8...",
                "info"
            );
        }
    );


    /*
       Manifest loaded
    */

    hls.on(

        Hls.Events.MANIFEST_LOADED,

        () => {

            log(
                "✓ 虚拟 M3U8 加载完成",
                "ok"
            );
        }
    );


    /*
       Manifest parsed
    */

    hls.on(

        Hls.Events.MANIFEST_PARSED,

        (
            event,
            data
        ) => {

            log(
                `✓ M3U8 解析成功：${data.levels.length} 个 Level`,
                "ok"
            );


            setLoading(
                false
            );


            setStatus(
                "M3U8 已加载，准备播放"
            );


            const p =
                video.play();


            if (
                p &&
                typeof p.catch ===
                "function"
            ) {

                p.catch(
                    error => {

                        if (
                            error &&
                            error.name ===
                            "NotAllowedError"
                        ) {

                            log(
                                "浏览器阻止自动播放，请点击播放",
                                "warn"
                            );

                            setStatus(
                                "请点击播放"
                            );

                        } else {

                            log(
                                "video.play()失败：" +
                                (
                                    error
                                        ? error.message
                                        : "未知错误"
                                ),
                                "warn"
                            );
                        }
                    }
                );
            }
        }
    );


    /*
       开始请求分片
    */

    hls.on(

        Hls.Events.FRAG_LOADING,

        (
            event,
            data
        ) => {

            currentSegment =
                data.frag.sn + 1;


            document.getElementById(
                "current"
            ).textContent =
                currentSegment;


            setStatus(
                `正在加载第 ${currentSegment} 片`
            );


            log(
                `开始加载第 ${currentSegment} 片`,
                "info"
            );


            log(
                `分片 URL：${data.frag.url}`,
                "url"
            );
        }
    );


    /*
       分片加载完成
    */

    hls.on(

        Hls.Events.FRAG_LOADED,

        (
            event,
            data
        ) => {

            successfulSegments++;


            updateStats();


            log(
                `✓ 第 ${data.frag.sn + 1} 片加载成功`,
                "ok"
            );


            setStatus(
                `已加载 ${successfulSegments} 片`
            );
        }
    );


    /*
       Fragment loading error
    */

    hls.on(

        Hls.Events.ERROR,

        (
            event,
            data
        ) => {

            let type =
                data.type || "unknown";

            let details =
                data.details || "unknown";


            log(
                `HLS：${type} / ${details}`,
                data.fatal
                    ? "error"
                    : "warn"
            );


            /*
               非 fatal：

               hls.js 自己处理。
            */

            if (!data.fatal) {

                return;
            }


            /*
               网络错误
            */

            if (
                type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ) {

                log(
                    "⚠ HLS 网络错误",
                    "warn"
                );


                /*
                   先尝试一次恢复
                */

                try {

                    hls.startLoad();

                    log(
                        "正在尝试恢复 HLS 网络加载...",
                        "warn"
                    );


                    /*
                       如果恢复后仍然失败，
                       由后续 fatal error 再处理。
                    */

                    return;

                } catch(e) {

                    log(
                        "HLS 网络恢复失败：" +
                        e.message,
                        "error"
                    );
                }
            }


            /*
               媒体错误
            */

            if (
                type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ) {

                log(
                    "⚠ HLS 媒体错误，尝试恢复",
                    "warn"
                );


                try {

                    hls.recoverMediaError();

                    return;

                } catch(e) {

                    log(
                        "媒体恢复失败：" +
                        e.message,
                        "error"
                    );
                }
            }


            /*
               最终 fallback
            */

            log(
                "❌ hls.js 无法继续播放",
                "error"
            );


            fallbackToAliyun();
        }
    );


    /*
       缓冲
    */

    hls.on(

        Hls.Events.BUFFER_APPENDED,

        () => {

            if (
                playerMode ===
                "hls"
            ) {

                setLoading(false);
            }
        }
    );
}


/* =========================================================
   HLS fallback
========================================================= */

function fallbackToHLS() {

    if (fallbackStarted) {

        return;
    }


    fallbackStarted = true;


    log(
        "② 原生 H5 播放失败",
        "warn"
    );


    log(
        "③ 切换到 hls.js 默认 Loader",
        "info"
    );


    setLoading(
        true,
        "正在切换 hls.js..."
    );


    setStatus(
        "正在切换 hls.js"
    );


    try {

        const virtualURL =
            createM3U8Blob();


        log(
            "✓ 已生成虚拟 M3U8",
            "ok"
        );


        log(
            "开始使用 hls.js 默认 Loader 加载",
            "ok"
        );


        startHLS(
            virtualURL
        );

    } catch(error) {

        log(
            "hls.js 启动失败：" +
            error.message,
            "error"
        );


        fallbackToAliyun();
    }
}


/* =========================================================
   Aliyun fallback
========================================================= */

function fallbackToAliyun() {

    if (aliyunStarted) {

        return;
    }


    aliyunStarted = true;


    log(
        "④ hls.js 无法继续播放",
        "error"
    );


    log(
        "⑤ 切换到阿里云原生 H5",
        "warn"
    );


    setLoading(
        true,
        "正在切换阿里云 H5..."
    );


    setTimeout(
        () => {

            openAliyunPlayer();

        },
        300
    );
}


/* =========================================================
   开始播放
========================================================= */

async function startPlayer() {

    /*
       完整停止旧播放器
    */

    stopPlayer();


    segments = [];

    successfulSegments = 0;

    failedSegments = 0;

    currentSegment = 0;

    fallbackStarted = false;

    hlsStarted = false;

    aliyunStarted = false;


    updateStats();


    setLoading(
        true,
        "正在读取 M3U8..."
    );


    setStatus(
        "正在读取 M3U8"
    );


    const url =
        input.value.trim();


    if (!url) {

        setLoading(false);

        alert(
            "请输入 M3U8 地址"
        );

        return;
    }


    originalM3U8URL =
        url;


    log(
        "================================",
        "dim"
    );


    log(
        "开始播放",
        "info"
    );


    log(
        `M3U8：${url}`,
        "url"
    );


    try {

        /*
           读取原始 M3U8
        */

        const text =
            await getM3U8(
                url
            );


        /*
           解析
        */

        parseM3U8(
            text,
            url
        );


        if (
            segments.length === 0
        ) {

            throw new Error(
                "没有找到有效媒体分片"
            );
        }


        log(
            `总分片：${segments.length}`,
            "ok"
        );


        /*
           优先原生 H5
        */

        try {

            await startNativeH5(
                url
            );


            /*
               真正 playing
               才会到这里
            */

            setLoading(false);

            return;

        } catch(nativeError) {

            log(
                `原生 H5 失败：${nativeError.message}`,
                "warn"
            );
        }


        /*
           进入 hls.js
        */

        fallbackToHLS();

    } catch(error) {

        console.error(error);


        log(
            `❌ 播放启动失败：${error.message}`,
            "error"
        );


        setLoading(false);


        setStatus(
            "M3U8 解析失败"
        );


        /*
           直接进入阿里云
        */

        setTimeout(
            () => {

                openAliyunPlayer();

            },
            300
        );
    }
}


/* =========================================================
   Video playing
========================================================= */

video.addEventListener(
    "playing",
    () => {

        setLoading(false);


        if (
            playerMode ===
            "native"
        ) {

            setStatus(
                "原生 H5 正在播放"
            );

        } else if (
            playerMode ===
            "hls"
        ) {

            setStatus(
                "hls.js 正在播放"
            );
        }


        log(
            "▶ 视频开始播放",
            "ok"
        );
    }
);


/* =========================================================
   Waiting
========================================================= */

video.addEventListener(
    "waiting",
    () => {

        if (
            playerMode ===
            "native" ||
            playerMode ===
            "hls"
        ) {

            setLoading(
                true,
                "正在缓冲..."
            );


            setStatus(
                "缓冲中"
            );
        }
    }
);


/* =========================================================
   Can play
========================================================= */

video.addEventListener(
    "canplay",
    () => {

        if (
            playerMode ===
            "native"
        ) {

            setLoading(false);

            setStatus(
                "原生 H5 可以播放"
            );

        } else if (
            playerMode ===
            "hls"
        ) {

            setLoading(false);

            setStatus(
                "hls.js 可以播放"
            );
        }
    }
);


/* =========================================================
   Ended
========================================================= */

video.addEventListener(
    "ended",
    () => {

        setLoading(false);

        setStatus(
            "播放结束"
        );


        log(
            "播放结束",
            "ok"
        );
    }
);


/* =========================================================
   Video error

   注意：

   hls.js 阶段不直接 fallback。

   由 hls.js ERROR 事件判断。
========================================================= */

video.addEventListener(
    "error",
    () => {

        const error =
            video.error;


        if (error) {

            log(
                `Video 错误：${error.code}`,
                "error"
            );
        }


        /*
           原生阶段：

           进入 HLS。

           但必须确保不是已经
           fallback 之后产生的旧事件。
        */

        if (
            playerMode ===
            "native"
        ) {

            log(
                "原生 H5 Video error，准备切换 hls.js",
                "warn"
            );


            fallbackToHLS();


            return;
        }


        /*
           hls.js 阶段：

           不直接 fallback。

           避免 hls.js 自己恢复时
           被 Video error 打断。
        */

        if (
            playerMode ===
            "hls"
        ) {

            log(
                "Video 层出现错误，等待 hls.js 判断",
                "warn"
            );
        }
    }
);


/* =========================================================
   初始化
========================================================= */

log(
    "PNG 伪装 TS HLS 播放器已启动",
    "ok"
);


log(
    "工作模式：原生 H5 → hls.js 默认 Loader → 阿里云 H5",
    "info"
);


log(
    "hls.js Loader：默认 Loader",
    "info"
);


log(
    "M3U8：过滤前5行 → EXTINF/URL → ENDLIST",
    "info"
);

</script>
