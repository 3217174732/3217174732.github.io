<script>


/* =========================================================
   全局变量
========================================================= */

let hls = null;

let mediaSource = null;

let currentObjectURL = null;

let segments = [];

let successfulSegments = 0;

let failedSegments = 0;

let currentSegment = 0;


/*
   当前原始 M3U8

   阿里云播放器需要使用原始地址
*/

let originalM3U8URL = "";


/*
   播放阶段

   native
   hls
   aliyun
*/

let playerMode = "";


/*
   是否已经进行过 fallback
*/

let fallbackStarted = false;


/*
   防止重复 fallback
*/

let fallbackTimer = null;


/* =========================================================
   日志
========================================================= */

function log(message, type = "info") {

    const box =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    const line =
        document.createElement("div");

    line.className =
        "log-line log-" + type;

    line.textContent =
        `[${time}] ${message}`;

    box.appendChild(line);

    box.scrollTop =
        box.scrollHeight;
}


function clearLog() {

    document.getElementById("log")
        .innerHTML = "";
}


/* =========================================================
   UI
========================================================= */

function setLoading(show, text) {

    const loading =
        document.getElementById("loading");

    const loadingText =
        document.getElementById("loadingText");

    loading.classList.toggle(
        "show",
        show
    );

    if (text) {

        loadingText.textContent =
            text;
    }
}


function setStatus(text) {

    document.getElementById("status")
        .textContent =
        text;
}


function updateStats() {

    document.getElementById("total")
        .textContent =
        segments.length;

    document.getElementById("success")
        .textContent =
        successfulSegments;

    document.getElementById("failed")
        .textContent =
        failedSegments;

    document.getElementById("current")
        .textContent =
        currentSegment || "-";


    let done =
        successfulSegments +
        failedSegments;


    let percent =
        segments.length
            ? done / segments.length * 100
            : 0;


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";
}


/* =========================================================
   隐藏阿里云 iframe
========================================================= */

function hideAliyunPlayer() {

    const iframe =
        document.getElementById(
            "aliyunPlayer"
        );

    iframe.style.display =
        "none";

    iframe.src =
        "about:blank";
}


/* =========================================================
   停止
========================================================= */

function stopPlayer() {

    fallbackStarted = false;

    if (fallbackTimer) {

        clearTimeout(
            fallbackTimer
        );

        fallbackTimer = null;
    }


    if (hls) {

        try {

            hls.destroy();

        } catch(e) {}

        hls = null;
    }


    const video =
        document.getElementById(
            "video"
        );


    try {

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

    } catch(e) {}


    hideAliyunPlayer();


    if (currentObjectURL) {

        URL.revokeObjectURL(
            currentObjectURL
        );

        currentObjectURL = null;
    }


    setLoading(false);

    setStatus("已停止");

    playerMode = "";


    log(
        "播放器已停止",
        "warn"
    );
}


/* =========================================================
   读取 M3U8
========================================================= */

async function getM3U8(url) {

    log(
        "正在读取 M3U8...",
        "info"
    );


    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `M3U8 HTTP ${response.status}`
        );
    }


    const text =
        await response.text();


    log(
        `M3U8 获取成功：${text.length} 字符`,
        "ok"
    );


    return text;
}


/* =========================================================
   解析 M3U8

   这里保持原来的逻辑
========================================================= */

function parseM3U8(text) {

    const lines =
        text
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            );


    segments = [];


    log(
        `M3U8 共 ${lines.length} 行`,
        "info"
    );


    /*
       前5行过滤

       从第6行开始
    */

    let i = 5;


    while (
        i < lines.length
    ) {

        const line =
            lines[i];


        /*
           ENDLIST
        */

        if (
            line ===
            "#EXT-X-ENDLIST"
        ) {

            log(
                "发现 #EXT-X-ENDLIST，停止解析",
                "ok"
            );

            break;
        }


        /*
           空行
        */

        if (!line) {

            i++;

            continue;
        }


        /*
           当前行必须是 EXTINF
        */

        if (
            !line.startsWith(
                "#EXTINF:"
            )
        ) {

            log(
                `第 ${i + 1} 行不是 EXTINF，跳过`,
                "warn"
            );

            i++;

            continue;
        }


        /*
           下一行媒体地址
        */

        const url =
            lines[i + 1];


        if (
            !url ||
            url.startsWith("#")
        ) {

            log(
                `第 ${i + 2} 行没有找到媒体地址`,
                "warn"
            );

            i += 2;

            continue;
        }


        /*
           EXTINF
        */

        let duration =
            line
                .substring(8)
                .replace(",", "")
                .trim();


        duration =
            parseFloat(
                duration
            );


        if (
            Number.isNaN(
                duration
            )
        ) {

            duration = 0;
        }


        segments.push({

            number:
                segments.length + 1,

            duration:
                duration,

            url:
                url

        });


        log(
            `分片 ${segments.length}：${url}`,
            "url"
        );


        i += 2;
    }


    log(
        `✓ 找到 ${segments.length} 个分片`,
        "ok"
    );


    updateStats();


    return segments;
}


/* =========================================================
   CustomTSLoader

   注意：

   这里保持你原来的代码逻辑
========================================================= */

class CustomTSLoader {

    constructor(config) {

        this.config = config;

        this.controller = null;

        this.aborted = false;

        this.stats = {

            trequest: 0,

            tfirst: 0,

            tload: 0,

            loaded: 0,

            total: 0
        };
    }


    load(
        context,
        config,
        callbacks
    ) {

        this.aborted = false;


        this.controller =
            new AbortController();


        this.stats = {

            trequest:
                performance.now(),

            tfirst: 0,

            tload: 0,

            loaded: 0,

            total: 0
        };


        const url =
            context.url;


        const isFragment =
            context.type ===
            "fragment";


        if (isFragment) {

            log(
                `请求媒体：${url}`,
                "url"
            );
        }


        fetch(

            url,

            {

                method:
                    "GET",

                cache:
                    "no-store",

                signal:
                    this.controller.signal
            }

        )

        .then(

            response => {

                if (
                    !response.ok
                ) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }


                this.stats.tfirst =
                    performance.now();


                const length =
                    response.headers.get(
                        "content-length"
                    );


                if (length) {

                    this.stats.total =
                        parseInt(
                            length,
                            10
                        );
                }


                return response.arrayBuffer();
            }

        )

        .then(

            buffer => {

                if (
                    this.aborted
                ) {

                    return;
                }


                this.stats.loaded =
                    buffer.byteLength;


                this.stats.tload =
                    performance.now();


                callbacks.onSuccess(

                    {

                        url:
                            url,

                        data:
                            buffer,

                        code:
                            200

                    },

                    this.stats,

                    context,

                    null

                );
            }

        )

        .catch(

            error => {

                if (
                    this.aborted
                ) {

                    return;
                }


                log(
                    `媒体请求失败：${error.message}`,
                    "error"
                );


                callbacks.onError(

                    {

                        code:
                            0,

                        text:
                            error.message

                    },

                    context,

                    null,

                    this.stats
                );
            }
        );
    }


    abort() {

        this.aborted =
            true;


        if (
            this.controller
        ) {

            try {

                this.controller.abort();

            } catch(e) {}
        }
    }


    destroy() {

        this.abort();

        this.controller =
            null;
    }
}


/* =========================================================
   创建虚拟 M3U8
========================================================= */

function createVirtualM3U8() {

    let result =
        "#EXTM3U\n" +
        "#EXT-X-VERSION:3\n" +
        "#EXT-X-TARGETDURATION:20\n" +
        "#EXT-X-MEDIA-SEQUENCE:0\n";


    for (
        const segment of segments
    ) {

        result +=
            `#EXTINF:${segment.duration},\n`;

        result +=
            `${segment.url}\n`;
    }


    result +=
        "#EXT-X-ENDLIST\n";


    return result;
}


/* =========================================================
   Blob M3U8
========================================================= */

function createM3U8Blob() {

    const text =
        createVirtualM3U8();


    const blob =
        new Blob(

            [text],

            {

                type:
                    "application/vnd.apple.mpegurl"
            }
        );


    if (
        currentObjectURL
    ) {

        URL.revokeObjectURL(
            currentObjectURL
        );
    }


    currentObjectURL =
        URL.createObjectURL(
            blob
        );


    return currentObjectURL;
}


/* =========================================================
   阿里云播放器

   使用：

   https://video.aliyuncs.com/player-detection/index.html?source=

   这个页面中的 Source 参数就是原始 M3U8
========================================================= */

function getAliyunURL(source) {

    return (
        "https://video.aliyuncs.com/player-detection/index.html?source=" +
        encodeURIComponent(source)
    );
}


/* =========================================================
   打开阿里云播放器
========================================================= */

function openAliyunPlayer() {

    const url =
        document
            .getElementById(
                "m3u8Input"
            )
            .value
            .trim();


    if (!url) {

        alert(
            "请先输入 M3U8 地址"
        );

        return;
    }


    originalM3U8URL =
        url;


    const iframe =
        document.getElementById(
            "aliyunPlayer"
        );


    const aliyunURL =
        getAliyunURL(
            url
        );


    log(
        "正在切换到阿里云原生 H5...",
        "warn"
    );


    log(
        `阿里云 Source：${url}`,
        "url"
    );


    /*
       停止本地播放器
    */

    if (hls) {

        try {

            hls.destroy();

        } catch(e) {}

        hls = null;
    }


    const video =
        document.getElementById(
            "video"
        );


    try {

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

    } catch(e) {}


    /*
       显示阿里云页面
    */

    iframe.src =
        aliyunURL;

    iframe.style.display =
        "block";


    playerMode =
        "aliyun";


    setLoading(
        false
    );


    setStatus(
        "阿里云原生 H5"
    );


    log(
        "✓ 已切换到阿里云播放器诊断页",
        "ok"
    );
}


/* =========================================================
   原生 H5 播放

   这里使用浏览器自己的 <video>

   不使用 hls.js
========================================================= */

function startNativeH5(url) {

    return new Promise(
        (resolve, reject) => {

            const video =
                document.getElementById(
                    "video"
                );


            playerMode =
                "native";


            hideAliyunPlayer();


            log(
                "① 开始尝试原生 H5 播放",
                "info"
            );


            /*
               检查浏览器能力
            */

            const canPlay =
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                );


            /*
               部分 Android 浏览器
               canPlayType 可能为空，
               但直接设置 src 仍然可以播放。

               所以不直接因为空值失败。
            */


            let settled =
                false;


            function success() {

                if (
                    settled
                ) {

                    return;
                }


                settled =
                    true;


                cleanup();


                log(
                    "✓ 原生 H5 已开始播放",
                    "ok"
                );


                setStatus(
                    "原生 H5 播放中"
                );


                resolve();
            }


            function failure(reason) {

                if (
                    settled
                ) {

                    return;
                }


                settled =
                    true;


                cleanup();


                log(
                    `原生 H5 播放失败：${reason || "未知错误"}`,
                    "warn"
                );


                reject(
                    new Error(
                        reason ||
                        "原生 H5 播放失败"
                    )
                );
            }


            function onPlaying() {

                success();
            }


            function onError() {

                const error =
                    video.error;


                if (
                    error
                ) {

                    failure(
                        `Video错误代码 ${error.code}`
                    );

                } else {

                    failure(
                        "Video error"
                    );
                }
            }


            function onLoadedMetadata() {

                log(
                    "原生 H5：loadedmetadata",
                    "info"
                );
            }


            function cleanup() {

                video.removeEventListener(
                    "playing",
                    onPlaying
                );

                video.removeEventListener(
                    "error",
                    onError
                );

                video.removeEventListener(
                    "loadedmetadata",
                    onLoadedMetadata
                );
            }


            video.addEventListener(
                "playing",
                onPlaying
            );


            video.addEventListener(
                "error",
                onError
            );


            video.addEventListener(
                "loadedmetadata",
                onLoadedMetadata
            );


            /*
               设置原始 M3U8
            */

            video.src =
                url;


            /*
               开始加载
            */

            video.load();


            /*
               尝试自动播放
            */

            const playPromise =
                video.play();


            if (
                playPromise &&
                typeof playPromise.catch ===
                "function"
            ) {

                playPromise.catch(
                    error => {

                        /*
                           NotAllowedError
                           通常只是浏览器禁止
                           自动播放。

                           不能把它当成视频播放失败。

                           用户点击播放以后仍可能正常播放。
                        */

                        if (
                            error &&
                            error.name ===
                            "NotAllowedError"
                        ) {

                            log(
                                "原生 H5：浏览器阻止自动播放，请点击播放",
                                "warn"
                            );

                            setLoading(
                                false
                            );

                            setStatus(
                                "请点击播放按钮"
                            );

                            /*
                               不 reject
                            */

                            return;
                        }


                        failure(
                            error
                                ? error.message
                                : "play()失败"
                        );
                    }
                );
            }


            /*
               8秒没有任何播放迹象，
               自动进入 hls.js
            */

            fallbackTimer =
                setTimeout(
                    () => {

                        if (
                            !settled
                        ) {

                            failure(
                                "原生 H5 8秒未开始播放"
                            );
                        }

                    },
                    8000
                );
        }
    );
}


/* =========================================================
   启动 hls.js

   下面保持你的原有逻辑
========================================================= */

function startHLS(blobURL) {

    const video =
        document.getElementById(
            "video"
        );


    playerMode =
        "hls";


    hideAliyunPlayer();


    /*
       浏览器原生 HLS

       这里原来的逻辑保留
    */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        log(
            "✓ 浏览器支持原生 HLS",
            "ok"
        );


        video.src =
            blobURL;


        video.addEventListener(

            "loadedmetadata",

            () => {

                setLoading(
                    false
                );


                video.play()
                    .catch(
                        () => {

                            log(
                                "浏览器阻止自动播放，请点击播放按钮",
                                "warn"
                            );
                        }
                    );
            },

            {
                once: true
            }
        );


        return;
    }


    /*
       hls.js
    */

    if (
        !window.Hls
    ) {

        throw new Error(
            "hls.js 加载失败"
        );
    }


    if (
        !Hls.isSupported()
    ) {

        throw new Error(
            "当前浏览器不支持 MSE"
        );
    }


    log(
        "✓ 浏览器支持 MSE",
        "ok"
    );


    /*
       自定义 Loader

       保持原来的配置
    */

    const config = {

        loader:
            CustomTSLoader,

        enableWorker:
            true,

        lowLatencyMode:
            false,

        backBufferLength:
            60,

        maxBufferLength:
            30,

        maxMaxBufferLength:
            60,

        manifestLoadingMaxRetry:
            2,

        fragLoadingMaxRetry:
            2,

        manifestLoadingRetryDelay:
            1000,

        fragLoadingRetryDelay:
            1000
    };


    hls =
        new Hls(
            config
        );


    /*
       HLS 事件
    */

    hls.on(

        Hls.Events.MEDIA_ATTACHED,

        () => {

            log(
                "✓ Video 已连接到 HLS",
                "ok"
            );


            hls.loadSource(
                blobURL
            );
        }
    );


    hls.on(

        Hls.Events.MANIFEST_LOADING,

        () => {

            log(
                "正在加载虚拟 M3U8...",
                "info"
            );
        }
    );


    hls.on(

        Hls.Events.MANIFEST_PARSED,

        (
            event,
            data
        ) => {

            log(
                `✓ M3U8 解析成功：${data.levels.length} 个 Level`,
                "ok"
            );


            setLoading(
                false
            );


            setStatus(
                "M3U8 已加载"
            );


            video.play()

                .then(

                    () => {

                        log(
                            "✓ 自动播放成功",
                            "ok"
                        );
                    }

                )

                .catch(

                    () => {

                        log(
                            "浏览器阻止自动播放，请点击播放",
                            "warn"
                        );


                        setStatus(
                            "请点击播放按钮"
                        );
                    }
                );
        }
    );


    /*
       每次加载分片
    */

    hls.on(

        Hls.Events.FRAG_LOADING,

        (
            event,
            data
        ) => {

            currentSegment =
                data.frag.sn + 1;


            document.getElementById(
                "current"
            ).textContent =
                currentSegment;


            setStatus(
                `正在加载第 ${currentSegment} 片`
            );
        }
    );


    /*
       分片加载完成
    */

    hls.on(

        Hls.Events.FRAG_LOADED,

        (
            event,
            data
        ) => {

            successfulSegments++;


            updateStats();


            log(
                `✓ 第 ${data.frag.sn + 1} 片加载成功`,
                "ok"
            );


            setStatus(
                `已加载 ${successfulSegments} 片`
            );
        }
    );


    /*
       HLS 错误
    */

    hls.on(

        Hls.Events.ERROR,

        (
            event,
            data
        ) => {

            log(

                `HLS：${data.type} / ${data.details}`,

                data.fatal
                    ? "error"
                    : "warn"
            );


            if (
                data.fatal
            ) {

                /*
                   网络错误
                */

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    log(
                        "⚠ HLS 网络错误，尝试恢复...",
                        "warn"
                    );


                    try {

                        hls.startLoad();

                    } catch(e) {

                        log(
                            "恢复失败：" +
                            e.message,
                            "error"
                        );


                        fallbackToAliyun();
                    }


                    return;
                }


                /*
                   媒体错误
                */

                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    log(
                        "⚠ HLS 媒体错误，尝试恢复...",
                        "warn"
                    );


                    try {

                        hls.recoverMediaError();

                    } catch(e) {

                        log(
                            "媒体恢复失败",
                            "error"
                        );


                        fallbackToAliyun();
                    }


                    return;
                }


                /*
                   其他致命错误
                */

                log(
                    "❌ HLS 无法继续播放",
                    "error"
                );


                setLoading(
                    false
                );


                setStatus(
                    "HLS 播放失败"
                );


                /*
                   最终进入阿里云
                */

                fallbackToAliyun();
            }
        }
    );


    /*
       连接 Video
    */

    hls.attachMedia(
        video
    );
}


/* =========================================================
   HLS fallback
========================================================= */

function fallbackToHLS() {

    if (
        fallbackStarted
    ) {

        return;
    }


    fallbackStarted =
        true;


    log(
        "② 原生 H5 播放失败",
        "warn"
    );


    log(
        "③ 切换到 hls.js + CustomTSLoader",
        "info"
    );


    setLoading(
        true,
        "正在切换 hls.js..."
    );


    setStatus(
        "正在切换 hls.js"
    );


    /*
       创建虚拟 M3U8
    */

    const virtualURL =
        createM3U8Blob();


    log(
        "✓ 已生成虚拟 M3U8",
        "ok"
    );


    log(
        "开始边下载边播放",
        "ok"
    );


    startHLS(
        virtualURL
    );
}


/* =========================================================
   最终 fallback 到阿里云
========================================================= */

function fallbackToAliyun() {

    if (
        playerMode ===
        "aliyun"
    ) {

        return;
    }


    log(
        "④ hls.js 无法继续播放",
        "error"
    );


    log(
        "⑤ 切换到阿里云原生 H5",
        "warn"
    );


    setLoading(
        true,
        "正在切换阿里云 H5..."
    );


    setTimeout(
        () => {

            openAliyunPlayer();

        },
        300
    );
}


/* =========================================================
   开始播放
========================================================= */

async function startPlayer() {

    stopPlayer();


    segments = [];

    successfulSegments = 0;

    failedSegments = 0;

    currentSegment = 0;

    fallbackStarted = false;


    updateStats();


    setLoading(
        true,
        "正在读取 M3U8..."
    );


    setStatus(
        "正在读取 M3U8"
    );


    const url =
        document
            .getElementById(
                "m3u8Input"
            )
            .value
            .trim();


    /*
       输入框为空
    */

    if (!url) {

        setLoading(
            false
        );


        alert(
            "请输入 M3U8 地址"
        );


        return;
    }


    /*
       保存原始地址
    */

    originalM3U8URL =
        url;


    try {

        log(
            "================================",
            "dim"
        );


        log(
            "开始播放",
            "info"
        );


        log(
            `M3U8：${url}`,
            "url"
        );


        /*
           =====================================================
           第一步

           读取 M3U8

           这个步骤主要用于：

           1. 验证 M3U8
           2. 提取 PNG 分片
           3. 生成虚拟 M3U8

           同时保留原始 M3U8 给阿里云使用
           =====================================================
        */

        const text =
            await getM3U8(
                url
            );


        /*
           解析
        */

        parseM3U8(
            text
        );


        if (
            segments.length === 0
        ) {

            throw new Error(
                "没有找到有效媒体分片"
            );
        }


        log(
            `总分片：${segments.length}`,
            "ok"
        );


        /*
           =====================================================
           第二步

           优先尝试浏览器原生 H5

           注意：

           这里使用的是原始 M3U8，
           不使用虚拟 M3U8。
           =====================================================
        */

        try {

            await startNativeH5(
                url
            );


            /*
               如果真正触发 playing，
               就不会继续进入 hls.js。
            */

            setLoading(
                false
            );


            return;

        } catch(nativeError) {

            log(
                `原生 H5 失败：${nativeError.message}`,
                "warn"
            );
        }


        /*
           =====================================================
           第三步

           原生 H5 失败

           使用你原来的 hls.js
           =====================================================
        */

        fallbackToHLS();


    } catch(error) {

        console.error(
            error
        );


        log(
            `❌ 播放启动失败：${error.message}`,
            "error"
        );


        setLoading(
            false
        );


        setStatus(
            "播放失败"
        );


        /*
           如果 M3U8 解析本身失败，
           直接交给阿里云诊断工具
        */

        log(
            "尝试使用阿里云原生 H5 诊断...",
            "warn"
        );


        setTimeout(
            () => {

                openAliyunPlayer();

            },
            300
        );
    }
}


/* =========================================================
   Video 事件
========================================================= */

const video =
    document.getElementById(
        "video"
    );


/*
   播放开始
*/

video.addEventListener(

    "playing",

    () => {

        setLoading(
            false
        );


        setStatus(
            playerMode === "hls"
                ? "hls.js 正在播放"
                : "原生 H5 正在播放"
        );


        log(
            "▶ 视频开始播放",
            "ok"
        );
    }
);


/*
   等待数据
*/

video.addEventListener(

    "waiting",

    () => {

        setLoading(
            true,
            "正在缓冲..."
        );


        setStatus(
            "缓冲中"
        );
    }
);


/*
   可以播放
*/

video.addEventListener(

    "canplay",

    () => {

        setLoading(
            false
        );


        setStatus(
            playerMode === "hls"
                ? "hls.js 可以播放"
                : "原生 H5 可以播放"
        );
    }
);


/*
   播放结束
*/

video.addEventListener(

    "ended",

    () => {

        setLoading(
            false
        );


        setStatus(
            "播放结束"
        );


        log(
            "播放结束",
            "ok"
        );
    }
);


/*
   Video error

   这里特别处理：

   如果是原生 H5 出错，
   自动进入 hls.js。

   如果 hls.js 的 video 出错，
   再进入阿里云。
*/

video.addEventListener(

    "error",

    () => {

        const error =
            video.error;


        if (
            error
        ) {

            log(
                `Video 错误：${error.code}`,
                "error"
            );
        }


        /*
           原生 H5 阶段
        */

        if (
            playerMode ===
            "native"
        ) {

            fallbackToHLS();

            return;
        }


        /*
           hls.js 阶段

           不立即因为一次 Video error
           就切换。

           hls.js 自己的 ERROR 事件
           会负责判断是否 fatal。
        */

        if (
            playerMode ===
            "hls"
        ) {

            log(
                "Video 层出现错误，等待 hls.js 判断...",
                "warn"
            );
        }
    }
);


/* =========================================================
   页面初始化
========================================================= */

log(
    "PNG 伪装 TS Loader 已启动",
    "ok"
);


log(
    "工作模式：原生 H5 → hls.js → 阿里云原生 H5",
    "info"
);


log(
    "M3U8 解析：过滤前5行 → EXTINF/URL → ENDLIST",
    "info"
);


</script>
