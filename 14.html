<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>PNG → MPEG-TS HLS 播放器</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

.container {
    width: min(1100px, 96%);
    margin: 20px auto;
}

h2 {
    margin-bottom: 15px;
}

.input-box {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #222;
    color: #fff;
    font-size: 14px;
}

button {
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    background: #1976d2;
    color: #fff;
}

button:hover {
    background: #2196f3;
}

video {
    display: block;
    width: 100%;
    max-height: 70vh;
    background: #000;
    margin-top: 15px;
}

.status {
    margin-top: 12px;
    padding: 10px;
    background: #181818;
    border: 1px solid #333;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 13px;
    line-height: 1.5;
    max-height: 350px;
    overflow-y: auto;
}

.ok {
    color: #65d68a;
}

.warn {
    color: #ffd166;
}

.err {
    color: #ff6b6b;
}
</style>
</head>

<body>

<div class="container">

    <h2>PNG 伪装 MPEG-TS HLS 播放器</h2>

    <div class="input-box">
        <input
            id="m3u8Input"
            value="https://3217174732.github.io/xxxxx.m3u8"
            placeholder="输入 M3U8 地址">
        <button onclick="start()">播放</button>
        <button onclick="stop()">停止</button>
    </div>

    <video
        id="video"
        controls
        playsinline
        preload="auto">
    </video>

    <div id="log" class="status"></div>

</div>

<script>

const video = document.getElementById("video");
const logBox = document.getElementById("log");

let hls = null;
let fragments = [];
let started = false;


/* =========================
   日志
========================= */

function log(msg, type = "") {

    const time = new Date().toLocaleTimeString();

    const line =
        `[${time}] ${msg}`;

    const div = document.createElement("div");

    if (type) {
        div.className = type;
    }

    div.textContent = line;

    logBox.appendChild(div);

    logBox.scrollTop = logBox.scrollHeight;

    console.log(line);
}


/* =========================
   停止
========================= */

function stop() {

    started = false;

    if (hls) {

        try {
            hls.destroy();
        } catch(e) {}

        hls = null;
    }

    try {
        video.pause();
    } catch(e) {}

    video.removeAttribute("src");

    try {
        video.load();
    } catch(e) {}

    log("播放器已停止");
}


/* =========================
   判断 TS
========================= */

function detectTS(buffer) {

    const data = new Uint8Array(buffer);

    if (data.length < 188) {
        return false;
    }

    /*
     MPEG-TS 常见同步字节：

     47
     47 xx xx
     47 xx xx
     ...
    */

    const offsets = [
        0,
        188,
        376,
        564,
        752
    ];

    let count = 0;

    for (const offset of offsets) {

        if (offset < data.length &&
            data[offset] === 0x47) {

            count++;
        }
    }

    return count >= 2;
}


/* =========================
   显示 HEX
========================= */

function hexPreview(buffer, length = 32) {

    const data = new Uint8Array(buffer);

    const n =
        Math.min(length, data.length);

    let result = "";

    for (let i = 0; i < n; i++) {

        result +=
            data[i]
                .toString(16)
                .padStart(2, "0")
                .toUpperCase();

        if (i !== n - 1) {
            result += " ";
        }
    }

    return result;
}


/* =========================
   获取 M3U8
========================= */

async function loadM3U8(url) {

    log("正在读取 M3U8...");

    const response = await fetch(url, {
        method: "GET",
        cache: "no-store"
    });

    if (!response.ok) {

        throw new Error(
            "M3U8 HTTP " + response.status
        );
    }

    const text =
        await response.text();

    log(
        "M3U8 获取成功：" +
        text.length +
        " 字符",
        "ok"
    );

    return text;
}


/* =========================
   解析 M3U8
========================= */

function parseM3U8(text, baseURL) {

    const lines =
        text
            .split(/\r?\n/)
            .map(x => x.trim());

    const result = [];

    let pendingDuration = null;

    for (let i = 0; i < lines.length; i++) {

        const line = lines[i];

        if (!line) {
            continue;
        }

        if (line.startsWith("#EXTINF:")) {

            const value =
                line.substring(8)
                    .split(",")[0];

            pendingDuration =
                parseFloat(value);

            continue;
        }

        if (line.startsWith("#")) {

            continue;
        }

        if (pendingDuration !== null) {

            let url;

            try {

                url =
                    new URL(line, baseURL)
                        .href;

            } catch(e) {

                log(
                    "无效分片 URL：" +
                    line,
                    "warn"
                );

                pendingDuration = null;

                continue;
            }

            result.push({
                url: url,
                duration: pendingDuration
            });

            pendingDuration = null;
        }
    }

    return result;
}


/* =========================
   创建虚拟 M3U8
========================= */

function createVirtualM3U8(list) {

    let result = "";

    result += "#EXTM3U\n";
    result += "#EXT-X-VERSION:3\n";

    let maxDuration = 1;

    for (const item of list) {

        if (item.duration > maxDuration) {
            maxDuration = item.duration;
        }
    }

    result +=
        "#EXT-X-TARGETDURATION:" +
        Math.ceil(maxDuration) +
        "\n";

    result += "#EXT-X-MEDIA-SEQUENCE:0\n";

    for (const item of list) {

        result +=
            "#EXTINF:" +
            item.duration.toFixed(3) +
            ",\n";

        result +=
            item.url +
            "\n";
    }

    result += "#EXT-X-ENDLIST\n";

    return result;
}


/* =========================
   创建 Blob M3U8
========================= */

function createBlobM3U8(text) {

    const blob =
        new Blob(
            [text],
            {
                type:
                    "application/vnd.apple.mpegurl"
            }
        );

    return URL.createObjectURL(blob);
}


/* =========================
   自定义 Loader
========================= */

class TSLoader {

    constructor(config) {

        this.config = config;

        this.context = null;

        this.stats = null;

        this.callbacks = null;

        this.aborted = false;

        this.controller = null;
    }


    destroy() {

        this.aborted = true;

        if (this.controller) {

            try {
                this.controller.abort();
            } catch(e) {}
        }
    }


    abort() {

        this.aborted = true;

        if (this.controller) {

            try {
                this.controller.abort();
            } catch(e) {}
        }
    }


    load(
        context,
        config,
        callbacks
    ) {

        this.context = context;

        this.callbacks = callbacks;

        this.aborted = false;

        const url =
            context.url;

        log(
            "开始加载 TS 分片：\n" +
            url
        );

        /*
         非常重要：

         这里不是让 hls.js 根据
         .png 后缀判断文件类型。

         而是直接 fetch URL，
         获取真正的二进制内容。
        */

        this.controller =
            new AbortController();

        const signal =
            this.controller.signal;

        const startTime =
            performance.now();

        fetch(url, {

            method: "GET",

            cache: "no-store",

            signal: signal,

            headers: {

                /*
                 不修改 Host / Origin。
                 浏览器禁止 JS 设置这些受保护 Header。
                */

                "Accept":
                    "*/*"
            }

        })

        .then(async response => {

            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }

            const buffer =
                await response.arrayBuffer();

            return {
                response,
                buffer
            };
        })

        .then(({response, buffer}) => {

            if (this.aborted) {
                return;
            }

            const elapsed =
                performance.now() -
                startTime;

            const size =
                buffer.byteLength;

            log(
                "TS HTTP：" +
                response.status +
                "，大小：" +
                size +
                " bytes",
                "ok"
            );

            log(
                "TS 文件头：" +
                hexPreview(buffer)
            );

            const isTS =
                detectTS(buffer);

            if (isTS) {

                log(
                    "✓ 检测到 MPEG-TS 同步字节 0x47",
                    "ok"
                );

            } else {

                log(
                    "⚠ 当前响应没有检测到标准 MPEG-TS 同步字节",
                    "warn"
                );

                /*
                 这里仍然把数据交给 hls.js。
                 因为某些 TS 数据不一定从
                 buffer[0] 开始。
                */
            }

            const stats = {

                trequest:
                    startTime,

                tfirst:
                    startTime,

                tload:
                    performance.now(),

                loaded:
                    size,

                total:
                    size
            };

            /*
             关键：

             把真正的 ArrayBuffer
             返回给 hls.js。
            */

            callbacks.onSuccess(
                {
                    url: url,
                    data: buffer
                },
                stats,
                context,
                response
            );

        })

        .catch(error => {

            if (this.aborted) {
                return;
            }

            log(
                "TS 分片加载失败：" +
                error.message,
                "err"
            );

            if (
                error.name ===
                "TypeError"
            ) {

                log(
                    "这通常意味着浏览器 CORS/fetch 被阻止。",
                    "err"
                );

                log(
                    "如果直接把该 PNG URL 放进浏览器地址栏可以访问，但 JS fetch 失败，仍然属于 CORS 限制。",
                    "warn"
                );
            }

            callbacks.onError(
                {
                    code: 0,
                    text: error.message
                },
                context
            );
        });
    }
}


/* =========================
   开始播放
========================= */

async function start() {

    if (started) {
        stop();
    }

    started = true;

    logBox.innerHTML = "";

    log("==============================");

    log("开始播放");

    const m3u8URL =
        document
            .getElementById("m3u8Input")
            .value
            .trim();

    if (!m3u8URL) {

        log(
            "请输入 M3U8 地址",
            "err"
        );

        return;
    }

    log(
        "M3U8：" +
        m3u8URL
    );


    /* -------------------------
       读取 M3U8
    ------------------------- */

    let text;

    try {

        text =
            await loadM3U8(
                m3u8URL
            );

    } catch(error) {

        log(
            "M3U8 加载失败：" +
            error.message,
            "err"
        );

        return;
    }


    /* -------------------------
       解析
    ------------------------- */

    fragments =
        parseM3U8(
            text,
            m3u8URL
        );

    log(
        "✓ 找到 " +
        fragments.length +
        " 个分片",
        "ok"
    );


    if (!fragments.length) {

        log(
            "没有找到 EXTINF 分片",
            "err"
        );

        return;
    }


    /*
     只打印前几个，
     避免日志刷屏。
    */

    for (
        let i = 0;
        i < Math.min(5, fragments.length);
        i++
    ) {

        log(
            "分片 " +
            (i + 1) +
            "：" +
            fragments[i].url
        );
    }


    if (fragments.length > 5) {

        log(
            "……其余 " +
            (fragments.length - 5) +
            " 个分片省略"
        );
    }


    /* -------------------------
       创建虚拟 M3U8
    ------------------------- */

    const virtualM3U8 =
        createVirtualM3U8(
            fragments
        );

    log(
        "✓ 已生成虚拟 M3U8",
        "ok"
    );


    /*
     注意：

     虚拟 M3U8 只是告诉 hls.js：

     第1片 URL 是 xxx.png
     第2片 URL 是 xxx.png
     ...

     它自己不是 TS。

     所以 TSLoader 只负责
     fragment 请求。
    */

    const blobURL =
        createBlobM3U8(
            virtualM3U8
        );


    /* -------------------------
       检查 hls.js
    ------------------------- */

    if (
        typeof Hls ===
        "undefined"
    ) {

        log(
            "hls.js 加载失败",
            "err"
        );

        return;
    }


    if (
        !Hls.isSupported()
    ) {

        log(
            "当前浏览器不支持 MSE",
            "err"
        );

        /*
         Safari 可能支持原生 HLS。
        */

        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src =
                m3u8URL;

            video.play()
                .catch(() => {

                    log(
                        "浏览器阻止自动播放，请点击播放",
                        "warn"
                    );

                });

        }

        return;
    }


    /* -------------------------
       创建 hls.js
    ------------------------- */

    log(
        "✓ 当前浏览器支持 MSE",
        "ok"
    );

    log(
        "启动 hls.js 自定义 TS Loader"
    );


    /*
     这里是最关键的修改。

     Loader 必须负责：

     manifest
     fragment

     两种请求。

     manifest 可以普通加载，
     fragment 必须 fetch 二进制。
    */

    class MixedLoader extends TSLoader {

        load(
            context,
            config,
            callbacks
        ) {

            /*
             manifest 请求
             使用普通 fetch，
             返回文本。
            */

            if (
                context.type ===
                "manifest"
            ) {

                const start =
                    performance.now();

                fetch(
                    context.url,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                )
                .then(async response => {

                    if (!response.ok) {

                        throw new Error(
                            "HTTP " +
                            response.status
                        );
                    }

                    const text =
                        await response.text();

                    callbacks.onSuccess(
                        {
                            url:
                                context.url,
                            data:
                                text
                        },
                        {
                            trequest:
                                start,
                            tfirst:
                                start,
                            tload:
                                performance.now(),
                            loaded:
                                text.length,
                            total:
                                text.length
                        },
                        context,
                        response
                    );
                })
                .catch(error => {

                    callbacks.onError(
                        {
                            code: 0,
                            text:
                                error.message
                        },
                        context
                    );
                });

                return;
            }


            /*
             key / fragment 等
             全部按照二进制读取。
            */

            super.load(
                context,
                config,
                callbacks
            );
        }
    }


    hls =
        new Hls({

            loader:
                MixedLoader,

            enableWorker:
                true,

            lowLatencyMode:
                false,

            backBufferLength:
                30,

            maxBufferLength:
                30,

            maxMaxBufferLength:
                60,

            fragLoadingMaxRetry:
                2,

            manifestLoadingMaxRetry:
                1

        });


    /* -------------------------
       事件
    ------------------------- */

    hls.on(
        Hls.Events.MEDIA_ATTACHED,
        () => {

            log(
                "✓ 视频已连接到 hls.js",
                "ok"
            );

            log(
                "正在加载虚拟 M3U8..."
            );

            hls.loadSource(
                blobURL
            );
        }
    );


    hls.on(
        Hls.Events.MANIFEST_LOADING,
        () => {

            log(
                "正在加载虚拟 M3U8..."
            );
        }
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        (event, data) => {

            log(
                "✓ M3U8 解析成功：" +
                data.levels.length +
                " 个 Level",
                "ok"
            );

            log(
                "✓ 虚拟 M3U8 加载完成",
                "ok"
            );

            /*
             不强制反复 play()。
             避免：

             play()
             ↓
             pause()
             ↓
             The play() request was interrupted
            */

            video.play()
                .then(() => {

                    log(
                        "✓ 播放开始",
                        "ok"
                    );

                })
                .catch(error => {

                    if (
                        error.name ===
                        "NotAllowedError"
                    ) {

                        log(
                            "浏览器阻止自动播放，请点击播放",
                            "warn"
                        );

                    } else {

                        log(
                            "自动播放未开始：" +
                            error.message,
                            "warn"
                        );
                    }
                });
        }
    );


    hls.on(
        Hls.Events.FRAG_LOADING,
        (event, data) => {

            log(
                "开始加载第 " +
                (data.frag.sn + 1) +
                " 片"
            );

            log(
                "分片网址：" +
                data.frag.url
            );
        }
    );


    hls.on(
        Hls.Events.FRAG_LOADED,
        (event, data) => {

            const payload =
                data.payload;

            if (payload) {

                log(
                    "✓ 分片 " +
                    (data.frag.sn + 1) +
                    " 已取得：" +
                    payload.byteLength +
                    " bytes",
                    "ok"
                );

                log(
                    "分片文件头：" +
                    hexPreview(
                        payload
                    )
                );
            }
        }
    );


    hls.on(
        Hls.Events.ERROR,
        (event, data) => {

            log(
                "HLS错误：" +
                data.type +
                " / " +
                data.details +
                " / fatal=" +
                data.fatal,
                data.fatal
                    ? "err"
                    : "warn"
            );


            if (
                data.frag &&
                data.frag.url
            ) {

                log(
                    "错误分片：" +
                    data.frag.url,
                    "err"
                );
            }


            if (
                data.fatal
            ) {

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    log(
                        "⚠ HLS 网络错误",
                        "warn"
                    );

                    /*
                     不立即无限 recover。
                     否则会出现反复请求。
                    */

                    setTimeout(() => {

                        if (
                            hls &&
                            started
                        ) {

                            try {

                                hls.startLoad();

                                log(
                                    "尝试恢复加载"
                                );

                            } catch(e) {}

                        }

                    }, 1000);

                } else if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    log(
                        "⚠ 媒体解析错误，尝试 recoverMediaError",
                        "warn"
                    );

                    try {

                        hls.recoverMediaError();

                    } catch(e) {

                        log(
                            "媒体恢复失败：" +
                            e.message,
                            "err"
                        );
                    }

                } else {

                    log(
                        "❌ HLS 无法继续播放",
                        "err"
                    );
                }
            }
        }
    );


    /* -------------------------
       绑定 video
    ------------------------- */

    hls.attachMedia(
        video
    );


    log(
        "✓ hls.js 已启动",
        "ok"
    );
}


/* =========================
   video 事件
========================= */

video.addEventListener(
    "error",
    () => {

        if (
            video.error
        ) {

            log(
                "Video 错误：" +
                video.error.code +
                " / " +
                video.error.message,
                "err"
            );
        }
    }
);


video.addEventListener(
    "playing",
    () => {

        log(
            "▶ Video 正在播放",
            "ok"
        );
    }
);


video.addEventListener(
    "waiting",
    () => {

        log(
            "Video 缓冲中..."
        );
    }
);

</script>

</body>
</html>
