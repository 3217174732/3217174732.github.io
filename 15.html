<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PNG 实际 TS → HLS 播放器</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

.container {
    width: min(1100px, 96%);
    margin: 20px auto;
}

h2 {
    margin: 0 0 15px;
}

video {
    display: block;
    width: 100%;
    max-height: 650px;
    background: #000;
    border-radius: 8px;
}

.panel {
    margin-top: 15px;
    padding: 15px;
    background: #1b1b1b;
    border-radius: 8px;
}

textarea {
    width: 100%;
    min-height: 100px;
    padding: 10px;
    color: #fff;
    background: #111;
    border: 1px solid #444;
    border-radius: 5px;
    resize: vertical;
    font-family: monospace;
}

button {
    margin-top: 10px;
    margin-right: 8px;
    padding: 9px 18px;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

#playBtn {
    background: #1677ff;
    color: #fff;
}

#stopBtn {
    background: #444;
    color: #fff;
}

#clearBtn {
    background: #666;
    color: #fff;
}

.status {
    margin-top: 10px;
    padding: 10px;
    background: #000;
    border-radius: 5px;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.5;
    max-height: 400px;
    overflow-y: auto;
}

.info {
    margin-top: 10px;
    padding: 10px;
    color: #aaa;
    font-size: 13px;
    line-height: 1.6;
    background: #151515;
    border-radius: 5px;
}

.success {
    color: #52c41a;
}

.warning {
    color: #faad14;
}

.error {
    color: #ff4d4f;
}

</style>

</head>


<body>

<div class="container">

    <h2>PNG 实际 TS → HLS 播放器</h2>

    <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>

    <div class="panel">

        <textarea
            id="m3u8Input"
            placeholder="输入 M3U8 地址"
        >https://3217174732.github.io/xxxxx.m3u8</textarea>

        <br>

        <button id="playBtn">
            开始播放
        </button>

        <button id="stopBtn">
            停止播放
        </button>

        <button id="clearBtn">
            清空日志
        </button>

        <div class="info">

            <b>当前工作方式：</b>

            <br>

            ① 获取 M3U8

            <br>

            ② 跳过前 5 行

            <br>

            ③ 从第 6 行开始解析 EXTINF / URL

            <br>

            ④ 创建虚拟 M3U8

            <br>

            ⑤ hls.js 加载虚拟 M3U8

            <br>

            ⑥ 自定义 Loader 请求 PNG URL 的真实二进制

            <br>

            ⑦ ArrayBuffer 直接交给 hls.js

            <br>

            ⑧ 如果内容实际是 MPEG-TS，则由 hls.js 解码

        </div>

        <div
            id="status"
            class="status"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   DOM
===================================================== */

const video =
    document.getElementById('video');

const statusBox =
    document.getElementById('status');

const m3u8Input =
    document.getElementById('m3u8Input');

const playBtn =
    document.getElementById('playBtn');

const stopBtn =
    document.getElementById('stopBtn');

const clearBtn =
    document.getElementById('clearBtn');


/* =====================================================
   全局变量
===================================================== */

let hls = null;

let manifestBlobUrl = null;

let currentSegments = [];

let virtualM3U8 = '';

let playing = false;


/* =====================================================
   日志
===================================================== */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    const line =
        `[${time}] ${message}`;

    console.log(line);

    statusBox.textContent +=
        line + '\n';

    statusBox.scrollTop =
        statusBox.scrollHeight;
}


function clearLog() {

    statusBox.textContent = '';

}


/* =====================================================
   停止播放器
===================================================== */

function stopPlayer() {

    playing = false;


    if (hls) {

        try {

            hls.destroy();

        } catch (e) {

            console.warn(e);

        }

        hls = null;
    }


    if (manifestBlobUrl) {

        try {

            URL.revokeObjectURL(
                manifestBlobUrl
            );

        } catch (e) {}

        manifestBlobUrl = null;
    }


    try {

        video.pause();

    } catch (e) {}


    video.removeAttribute(
        'src'
    );


    try {

        video.load();

    } catch (e) {}


    currentSegments = [];

    virtualM3U8 = '';

}


/* =====================================================
   获取 M3U8
===================================================== */

async function fetchM3U8(url) {

    log(
        '正在读取 M3U8...'
    );


    const response =
        await fetch(
            url,
            {
                method: 'GET',

                cache: 'no-cache'
            }
        );


    if (!response.ok) {

        throw new Error(
            `M3U8 HTTP ${response.status}`
        );
    }


    const text =
        await response.text();


    log(
        `M3U8 获取成功：${text.length} 字符`
    );


    return text;
}


/* =====================================================
   M3U8 解析

   重点：

   前 5 行完全跳过

   第 6 行开始解析
===================================================== */

function parseM3U8(
    text,
    baseUrl
) {

    const rawLines =
        text
            .replace(/\r/g, '')
            .split('\n');


    log(
        `M3U8 原始行数：${rawLines.length}`
    );


    if (
        rawLines.length <= 5
    ) {

        throw new Error(
            'M3U8 少于 6 行'
        );
    }


    /*
    ---------------------------------------------
    跳过前 5 行
    ---------------------------------------------
    */

    const lines =
        rawLines
            .slice(5)
            .map(
                line =>
                    line.trim()
            );


    log(
        '✓ 已跳过 M3U8 前 5 行'
    );


    log(
        `从第 6 行开始解析，共 ${lines.length} 行`
    );


    const segments = [];

    let pendingDuration = null;

    let mediaSequence = 0;


    /*
    ---------------------------------------------
    从第 6 行开始
    ---------------------------------------------
    */

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];


        /*
        -----------------------------------------
        空行
        -----------------------------------------
        */

        if (!line) {

            continue;
        }


        /*
        -----------------------------------------
        ENDLIST

        一定优先处理
        -----------------------------------------
        */

        if (
            line === '#EXT-X-ENDLIST'
        ) {

            log(
                '发现 #EXT-X-ENDLIST，停止解析'
            );

            break;
        }


        /*
        -----------------------------------------
        MEDIA-SEQUENCE
        -----------------------------------------
        */

        if (
            line.startsWith(
                '#EXT-X-MEDIA-SEQUENCE:'
            )
        ) {

            mediaSequence =
                parseInt(
                    line.substring(
                        '#EXT-X-MEDIA-SEQUENCE:'.length
                    ),
                    10
                ) || 0;

            continue;
        }


        /*
        -----------------------------------------
        EXTINF
        -----------------------------------------
        */

        if (
            line.startsWith(
                '#EXTINF:'
            )
        ) {

            const value =
                line.substring(
                    8
                );


            const durationText =
                value.split(',')[0];


            const duration =
                parseFloat(
                    durationText
                );


            pendingDuration =
                Number.isFinite(
                    duration
                )
                    ? duration
                    : 10;


            continue;
        }


        /*
        -----------------------------------------
        URL

        必须有前一个 EXTINF
        -----------------------------------------
        */

        if (
            !line.startsWith('#') &&
            pendingDuration !== null
        ) {

            let segmentUrl;


            try {

                segmentUrl =
                    new URL(
                        line,
                        baseUrl
                    ).href;

            } catch (e) {

                log(
                    '无效分片 URL：' +
                    line
                );

                pendingDuration =
                    null;

                continue;
            }


            segments.push({

                url:
                    segmentUrl,

                duration:
                    pendingDuration,

                sequence:
                    mediaSequence +
                    segments.length

            });


            log(
                `分片 ${segments.length}：${segmentUrl}`
            );


            pendingDuration =
                null;


            continue;
        }


        /*
        -----------------------------------------
        其他 EXT 标签直接忽略
        -----------------------------------------
        */

        if (
            line.startsWith('#')
        ) {

            continue;
        }

    }


    if (
        !segments.length
    ) {

        throw new Error(
            '从第 6 行开始没有找到有效 EXTINF 分片'
        );
    }


    log(
        `✓ 找到 ${segments.length} 个分片`
    );


    return {

        segments,

        mediaSequence
    };
}


/* =====================================================
   创建虚拟 M3U8
===================================================== */

function createVirtualM3U8(
    segments,
    mediaSequence
) {

    let maxDuration = 1;


    for (
        const segment of segments
    ) {

        maxDuration =
            Math.max(
                maxDuration,
                Math.ceil(
                    segment.duration
                )
            );

    }


    const lines = [];


    lines.push(
        '#EXTM3U'
    );


    lines.push(
        '#EXT-X-VERSION:3'
    );


    lines.push(
        '#EXT-X-TARGETDURATION:' +
        maxDuration
    );


    lines.push(
        '#EXT-X-MEDIA-SEQUENCE:' +
        mediaSequence
    );


    for (
        const segment of segments
    ) {

        lines.push(
            '#EXTINF:' +
            segment.duration.toFixed(3) +
            ','
        );


        lines.push(
            segment.url
        );

    }


    lines.push(
        '#EXT-X-ENDLIST'
    );


    return lines.join('\n');
}


/* =====================================================
   TS 检测

   MPEG-TS：

   188 bytes 一个 packet

   正常情况下：

   byte[0]   = 0x47
   byte[188] = 0x47
   byte[376] = 0x47
   ...
===================================================== */

function isMPEGTS(
    buffer
) {

    if (
        !buffer ||
        buffer.byteLength < 188
    ) {

        return false;
    }


    const bytes =
        new Uint8Array(
            buffer
        );


    let matches = 0;


    const positions = [

        0,

        188,

        376,

        564,

        752

    ];


    for (
        const position of positions
    ) {

        if (
            position <
            bytes.length
        ) {

            if (
                bytes[position] ===
                0x47
            ) {

                matches++;
            }

        }

    }


    /*
    至少两个同步点
    */

    return matches >= 2;
}


/* =====================================================
   打印文件头
===================================================== */

function dumpHeader(
    buffer
) {

    const bytes =
        new Uint8Array(
            buffer,
            0,
            Math.min(
                32,
                buffer.byteLength
            )
        );


    return Array
        .from(bytes)
        .map(
            x =>
                x
                    .toString(16)
                    .padStart(
                        2,
                        '0'
                    )
        )
        .join(' ');
}


/* =====================================================
   创建 Blob M3U8
===================================================== */

function createManifestBlob(
    content
) {

    if (
        manifestBlobUrl
    ) {

        try {

            URL.revokeObjectURL(
                manifestBlobUrl
            );

        } catch (e) {}

    }


    const blob =
        new Blob(
            [content],
            {
                type:
                    'application/vnd.apple.mpegurl'
            }
        );


    manifestBlobUrl =
        URL.createObjectURL(
            blob
        );


    return manifestBlobUrl;
}


/* =====================================================
   自定义 TS Loader

   这里是核心。

   hls.js 请求：

   https://static.dingtalk.com/xxx.png

   我们不关心 .png 后缀。

   直接：

   XMLHttpRequest
       ↓
   ArrayBuffer
       ↓
   hls.js
===================================================== */

class TSLoader
    extends Hls.DefaultConfig.loader {

    constructor(config) {

        super(config);

        this.xhr = null;

        this.context = null;

        this.stats = null;
    }


    destroy() {

        if (
            this.xhr
        ) {

            try {

                this.xhr.abort();

            } catch (e) {}

            this.xhr = null;
        }


        /*
        不调用 super.destroy()

        某些 hls.js 版本的 DefaultLoader
        可能没有这个方法。
        */

    }


    abort() {

        if (
            this.xhr
        ) {

            try {

                this.xhr.abort();

            } catch (e) {}

        }

    }


    load(
        context,
        config,
        callbacks
    ) {

        this.context =
            context;


        this.stats =
            context.stats;


        const url =
            context.url;


        log(
            '--------------------------------'
        );


        log(
            '加载 TS 分片：' +
            url
        );


        const xhr =
            new XMLHttpRequest();


        this.xhr =
            xhr;


        /*
        ---------------------------------------------
        请求
        ---------------------------------------------
        */

        try {

            xhr.open(
                'GET',
                url,
                true
            );

        } catch (e) {

            log(
                'XHR open 失败：' +
                e.message
            );

            callbacks.onError(
                {
                    code: 0,

                    text:
                        e.message

                },
                context,
                null
            );

            return;
        }


        /*
        ---------------------------------------------
        最重要：

        二进制
        ---------------------------------------------
        */

        xhr.responseType =
            'arraybuffer';


        /*
        ---------------------------------------------
        请求头

        只能设置浏览器允许脚本设置的请求头。

        不伪造 Origin / Referer。
        ---------------------------------------------
        */

        try {

            xhr.setRequestHeader(
                'Accept',
                '*/*'
            );

        } catch (e) {

            console.warn(
                'Accept 请求头设置失败',
                e
            );

        }


        /*
        ---------------------------------------------
        Load
        ---------------------------------------------
        */

        xhr.onload =
            () => {

                /*
                当前 Loader 已经被销毁
                */

                if (
                    !this.xhr
                ) {

                    return;
                }


                const status =
                    xhr.status;


                if (
                    status >= 200 &&
                    status < 300
                ) {

                    const data =
                        xhr.response;


                    if (
                        !data
                    ) {

                        log(
                            '❌ HTTP 200，但没有收到二进制数据'
                        );


                        callbacks.onError(
                            {
                                code: 0,

                                text:
                                    'Empty response'

                            },
                            context,
                            null
                        );

                        return;
                    }


                    /*
                    ---------------------------------
                    HTTP
                    ---------------------------------
                    */

                    log(
                        `HTTP: ${status}`
                    );


                    /*
                    ---------------------------------
                    文件大小
                    ---------------------------------
                    */

                    log(
                        `文件大小: ${data.byteLength} bytes`
                    );


                    /*
                    ---------------------------------
                    文件头

                    注意：

                    这里检测的是 TS 分片。

                    不是虚拟 M3U8。
                    ---------------------------------
                    */

                    log(
                        'TS 文件头：' +
                        dumpHeader(data)
                    );


                    /*
                    ---------------------------------
                    MPEG-TS 检测
                    ---------------------------------
                    */

                    const isTS =
                        isMPEGTS(
                            data
                        );


                    if (
                        isTS
                    ) {

                        log(
                            'MPEG-TS 检测：✓ 检测到 MPEG-TS'
                        );

                    } else {

                        log(
                            'MPEG-TS 检测：⚠ 未检测到标准 TS 同步字节'
                        );

                    }


                    /*
                    ---------------------------------
                    直接交给 hls.js

                    不 Blob

                    不 Base64

                    不重新编码

                    不修改数据
                    ---------------------------------
                    */

                    callbacks.onSuccess(

                        {
                            url:
                                url,

                            data:
                                data
                        },

                        this.stats,

                        context,

                        null

                    );


                    return;
                }


                /*
                ---------------------------------------------
                HTTP 错误
                ---------------------------------------------
                */

                log(
                    `TS 分片 HTTP 错误：${status}`
                );


                callbacks.onError(

                    {
                        code:
                            status,

                        text:
                            'HTTP ' +
                            status
                    },

                    context,

                    null

                );

            };


        /*
        ---------------------------------------------
        网络错误
        ---------------------------------------------
        */

        xhr.onerror =
            () => {

                log(
                    '❌ TS 分片加载失败：Network Error / CORS'
                );


                callbacks.onError(

                    {
                        code:
                            0,

                        text:
                            'Network Error / CORS'
                    },

                    context,

                    null

                );

            };


        /*
        ---------------------------------------------
        超时
        ---------------------------------------------
        */

        xhr.ontimeout =
            () => {

                log(
                    '❌ TS 分片请求超时'
                );


                callbacks.onError(

                    {
                        code:
                            0,

                        text:
                            'Timeout'
                    },

                    context,

                    null

                );

            };


        /*
        ---------------------------------------------
        进度
        ---------------------------------------------
        */

        xhr.onprogress =
            event => {

                if (
                    callbacks.onProgress
                ) {

                    callbacks.onProgress(

                        {
                            loaded:
                                event.loaded,

                            total:
                                event.lengthComputable
                                    ? event.total
                                    : 0,

                            bwEstimate:
                                0
                        },

                        context,

                        null

                    );

                }

            };


        /*
        ---------------------------------------------
        开始请求
        ---------------------------------------------
        */

        try {

            xhr.send();

        } catch (e) {

            log(
                '❌ xhr.send() 失败：' +
                e.message
            );


            callbacks.onError(

                {
                    code:
                        0,

                    text:
                        e.message
                },

                context,

                null

            );

        }

    }

}


/* =====================================================
   创建 HLS
===================================================== */

function createHls() {

    /*
    如果已经存在
    */

    if (
        hls
    ) {

        try {

            hls.destroy();

        } catch (e) {}

        hls = null;
    }


    /*
    ---------------------------------------------
    创建 hls.js
    ---------------------------------------------
    */

    hls =
        new Hls({

            /*
            fragment 和 manifest 都经过这个 Loader。

            Blob M3U8：

            loader 读取的是 Blob URL

            fragment：

            loader 读取真实 PNG URL
            */

            loader:
                TSLoader,


            enableWorker:
                true,


            lowLatencyMode:
                false,


            backBufferLength:
                30,


            maxBufferLength:
                30,


            maxBufferSize:
                60 * 1000 * 1000,


            fragLoadingTimeOut:
                20000,


            manifestLoadingTimeOut:
                10000,


            manifestLoadingMaxRetry:
                2,


            fragLoadingMaxRetry:
                2

        });


    return hls;
}


/* =====================================================
   播放
===================================================== */

async function startPlayer() {

    /*
    ---------------------------------------------
    防止重复启动
    ---------------------------------------------
    */

    stopPlayer();


    clearLog();


    playing = true;


    const source =
        m3u8Input.value.trim();


    if (
        !source
    ) {

        log(
            '❌ 请输入 M3U8 地址'
        );

        return;
    }


    log(
        '================================'
    );


    log(
        '开始播放'
    );


    log(
        'M3U8：' +
        source
    );


    try {

        /*
        ---------------------------------------------
        第一步：读取 M3U8
        ---------------------------------------------
        */

        const text =
            await fetchM3U8(
                source
            );


        if (
            !playing
        ) {

            return;
        }


        /*
        ---------------------------------------------
        第二步：

        前 5 行跳过

        第 6 行开始解析
        ---------------------------------------------
        */

        const parsed =
            parseM3U8(
                text,
                source
            );


        currentSegments =
            parsed.segments;


        log(
            `总分片：${currentSegments.length}`
        );


        /*
        ---------------------------------------------
        第三步：

        生成虚拟 M3U8
        ---------------------------------------------
        */

        virtualM3U8 =
            createVirtualM3U8(

                currentSegments,

                parsed.mediaSequence

            );


        log(
            '✓ 已生成虚拟 M3U8'
        );


        /*
        ---------------------------------------------
        第四步：

        输出虚拟 M3U8 前几行
        ---------------------------------------------
        */

        log(
            '虚拟 M3U8：'
        );


        const debugLines =
            virtualM3U8
                .split('\n')
                .slice(
                    0,
                    12
                );


        log(
            debugLines.join('\n')
        );


        /*
        ---------------------------------------------
        第五步：

        检查 MSE
        ---------------------------------------------
        */

        if (
            !Hls.isSupported()
        ) {

            log(
                '❌ 当前浏览器不支持 MSE'
            );

            return;
        }


        log(
            '✓ 当前浏览器支持 MSE'
        );


        /*
        ---------------------------------------------
        第六步：

        Blob M3U8
        ---------------------------------------------
        */

        const manifestUrl =
            createManifestBlob(
                virtualM3U8
            );


        log(
            '虚拟 M3U8 Blob：' +
            manifestUrl
        );


        /*
        ---------------------------------------------
        第七步：

        创建 hls.js
        ---------------------------------------------
        */

        createHls();


        /*
        ---------------------------------------------
        MEDIA_ATTACHED
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.MEDIA_ATTACHED,

            () => {

                log(
                    '✓ 视频已连接到 hls.js'
                );

            }

        );


        /*
        ---------------------------------------------
        MANIFEST_LOADING
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.MANIFEST_LOADING,

            () => {

                log(
                    '正在加载虚拟 M3U8...'
                );

            }

        );


        /*
        ---------------------------------------------
        MANIFEST_LOADED
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.MANIFEST_LOADED,

            () => {

                log(
                    '✓ 虚拟 M3U8 加载完成'
                );

            }

        );


        /*
        ---------------------------------------------
        MANIFEST_PARSED
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.MANIFEST_PARSED,

            (
                event,
                data
            ) => {

                log(
                    '✓ M3U8 解析成功：' +
                    data.levels.length +
                    ' 个 Level'
                );


                log(
                    '准备加载第 1 个 TS 分片'
                );


                /*
                不在这里无限循环 play()

                只尝试一次。
                */

                setTimeout(
                    () => {

                        if (
                            !playing
                        ) {

                            return;
                        }


                        video.play()
                            .then(
                                () => {

                                    log(
                                        '✓ 自动播放成功'
                                    );

                                }
                            )
                            .catch(
                                error => {

                                    /*
                                    Chrome 常见：

                                    play() request was
                                    interrupted by pause()

                                    不把它当成 HLS
                                    网络错误。
                                    */

                                    if (
                                        error &&
                                        error.name ===
                                        'AbortError'
                                    ) {

                                        log(
                                            '自动播放被浏览器中断，请点击视频播放按钮'
                                        );

                                    } else {

                                        log(
                                            '浏览器阻止自动播放，请点击播放'
                                        );

                                    }

                                }
                            );

                    },
                    300
                );

            }

        );


        /*
        ---------------------------------------------
        FRAG_LOADING
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.FRAG_LOADING,

            (
                event,
                data
            ) => {

                const number =
                    currentSegments.length
                        ? currentSegments.findIndex(
                            item =>
                                item.sequence ===
                                data.frag.sn
                        ) + 1
                        : data.frag.sn + 1;


                log(
                    '开始加载第 ' +
                    number +
                    ' 片'
                );


                log(
                    '分片网址：' +
                    data.frag.url
                );

            }

        );


        /*
        ---------------------------------------------
        FRAG_LOADED
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.FRAG_LOADED,

            (
                event,
                data
            ) => {

                let size = 0;


                if (
                    data.payload
                ) {

                    if (
                        data.payload.byteLength
                    ) {

                        size =
                            data.payload.byteLength;

                    } else if (
                        data.payload.length
                    ) {

                        size =
                            data.payload.length;

                    }

                }


                log(
                    '✓ TS 分片加载成功：' +
                    size +
                    ' bytes'
                );

            }

        );


        /*
        ---------------------------------------------
        BUFFER_CREATED
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.BUFFER_CREATED,

            () => {

                log(
                    '✓ MSE Buffer 已创建'
                );

            }

        );


        /*
        ---------------------------------------------
        FRAG_BUFFERED
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.FRAG_BUFFERED,

            (
                event,
                data
            ) => {

                log(
                    '✓ 分片已进入 MSE Buffer：' +
                    data.frag.sn
                );

            }

        );


        /*
        ---------------------------------------------
        ERROR
        ---------------------------------------------
        */

        hls.on(

            Hls.Events.ERROR,

            (
                event,
                data
            ) => {

                console.error(
                    'HLS ERROR',
                    data
                );


                log(
                    'HLS错误：' +
                    data.type +
                    ' / ' +
                    data.details +
                    (
                        data.fatal
                            ? ' / FATAL'
                            : ''
                    )
                );


                if (
                    data.frag &&
                    data.frag.url
                ) {

                    log(
                        '错误分片：' +
                        data.frag.url
                    );

                }


                /*
                -------------------------------------
                FATAL NETWORK
                -------------------------------------
                */

                if (
                    data.fatal &&
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    log(
                        '⚠ HLS 网络错误，尝试恢复'
                    );


                    try {

                        hls.startLoad();

                    } catch (e) {

                        log(
                            '恢复失败：' +
                            e.message
                        );

                    }


                    return;
                }


                /*
                -------------------------------------
                FATAL MEDIA
                -------------------------------------
                */

                if (
                    data.fatal &&
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    log(
                        '⚠ HLS Media Error，尝试恢复'
                    );


                    try {

                        hls.recoverMediaError();

                    } catch (e) {

                        log(
                            'Media 恢复失败：' +
                            e.message
                        );

                    }


                    return;
                }


                /*
                -------------------------------------
                其他 FATAL
                -------------------------------------
                */

                if (
                    data.fatal
                ) {

                    log(
                        '❌ HLS 无法继续播放'
                    );

                }

            }

        );


        /*
        ---------------------------------------------
        先 attach
        ---------------------------------------------
        */

        hls.attachMedia(
            video
        );


        /*
        ---------------------------------------------
        再加载 manifest
        ---------------------------------------------
        */

        hls.loadSource(
            manifestUrl
        );


        log(
            '✓ hls.js 已启动'
        );

    }
    catch (error) {

        console.error(
            error
        );


        log(
            '❌ 播放失败：' +
            error.message
        );

    }

}


/* =====================================================
   按钮
===================================================== */

playBtn.onclick =
    () => {

        startPlayer();

    };


stopBtn.onclick =
    () => {

        stopPlayer();

        log(
            '播放器已停止'
        );

    };


clearBtn.onclick =
    () => {

        clearLog();

    };


/* =====================================================
   Video 事件
===================================================== */

video.addEventListener(

    'error',

    () => {

        if (
            video.error
        ) {

            log(
                'Video 错误：' +
                video.error.code +
                ' / ' +
                (
                    video.error.message ||
                    '未知错误'
                )
            );

        }

    }

);


video.addEventListener(

    'loadedmetadata',

    () => {

        log(
            '✓ 视频 metadata 加载成功'
        );

    }

);


video.addEventListener(

    'canplay',

    () => {

        log(
            '✓ 视频可以开始播放'
        );

    }

);


video.addEventListener(

    'playing',

    () => {

        log(
            '▶ 视频正在播放'
        );

    }

);


video.addEventListener(

    'pause',

    () => {

        /*
        不打印初始化阶段的 pause
        */

        if (
            playing
        ) {

            log(
                '视频暂停'
            );

        }

    }

);


video.addEventListener(

    'waiting',

    () => {

        log(
            '视频缓冲中...'
        );

    }

);


/* =====================================================
   初始化
===================================================== */

log(
    'PNG 实际 TS HLS 播放器已启动'
);

log(
    '工作模式：原始 M3U8 → 跳过前5行 → hls.js'
);

log(
    'M3U8 从第6行开始解析'
);

log(
    '分片使用 ArrayBuffer 二进制读取'
);

log(
    '不根据 .png 扩展名判断真实格式'
);

</script>
