<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PNG 实际 TS → HLS 播放器</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

.container {
    width: min(1100px, 96%);
    margin: 20px auto;
}

h2 {
    margin: 0 0 15px;
}

video {
    display: block;
    width: 100%;
    max-height: 650px;
    background: #000;
    border-radius: 8px;
}

.panel {
    margin-top: 15px;
    padding: 15px;
    background: #1b1b1b;
    border-radius: 8px;
}

textarea {
    width: 100%;
    min-height: 90px;
    padding: 10px;
    color: #fff;
    background: #111;
    border: 1px solid #444;
    border-radius: 5px;
    resize: vertical;
}

button {
    margin-top: 10px;
    margin-right: 8px;
    padding: 9px 18px;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
}

#playBtn {
    background: #1677ff;
    color: #fff;
}

#stopBtn {
    background: #444;
    color: #fff;
}

.status {
    margin-top: 10px;
    padding: 10px;
    background: #000;
    border-radius: 5px;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: monospace;
    font-size: 13px;
    max-height: 400px;
    overflow-y: auto;
}

.info {
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
    line-height: 1.7;
}

</style>
</head>

<body>

<div class="container">

    <h2>PNG 实际 TS → HLS 播放器</h2>

    <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>

    <div class="panel">

        <textarea id="m3u8Input">https://3217174732.github.io/xxxxx.m3u8</textarea>

        <br>

        <button id="playBtn">
            开始播放
        </button>

        <button id="stopBtn">
            停止播放
        </button>

        <div class="info">
            M3U8：从第 6 行开始按 EXTINF → URL 读取分片。<br>
            Manifest：使用 hls.js 默认 Loader。<br>
            Fragment：使用自定义 ArrayBuffer Loader。<br>
            PNG 扩展名不会参与媒体格式判断，直接读取真实二进制内容。
        </div>

        <div
            id="status"
            class="status"
        ></div>

    </div>

</div>

<script>

/* =====================================================
   DOM
===================================================== */

const video =
    document.getElementById('video');

const statusBox =
    document.getElementById('status');

const m3u8Input =
    document.getElementById('m3u8Input');

const playBtn =
    document.getElementById('playBtn');

const stopBtn =
    document.getElementById('stopBtn');


/* =====================================================
   全局状态
===================================================== */

let hls = null;

let manifestBlobUrl = null;

let currentSegments = [];

let virtualM3U8 = '';

let playing = false;

let fatalErrorHandled = false;


/* =====================================================
   日志
===================================================== */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    const line =
        `[${time}] ${message}`;

    console.log(line);

    statusBox.textContent +=
        line + '\n';

    statusBox.scrollTop =
        statusBox.scrollHeight;
}


function clearLog() {

    statusBox.textContent = '';

}


/* =====================================================
   停止播放器
===================================================== */

function stopPlayer() {

    playing = false;

    fatalErrorHandled = false;


    if (hls) {

        try {
            hls.stopLoad();
        } catch (e) {}

        try {
            hls.destroy();
        } catch (e) {}

        hls = null;
    }


    if (manifestBlobUrl) {

        try {

            URL.revokeObjectURL(
                manifestBlobUrl
            );

        } catch (e) {}

        manifestBlobUrl = null;
    }


    try {
        video.pause();
    } catch (e) {}


    video.removeAttribute('src');


    try {
        video.load();
    } catch (e) {}


    currentSegments = [];

    virtualM3U8 = '';

    log('播放器已停止');
}


/* =====================================================
   获取原始 M3U8
===================================================== */

async function fetchM3U8(url) {

    log('正在读取 M3U8...');


    const response =
        await fetch(
            url,
            {
                method: 'GET',

                cache: 'no-cache'
            }
        );


    if (!response.ok) {

        throw new Error(
            `M3U8 HTTP ${response.status}`
        );
    }


    const text =
        await response.text();


    log(
        `M3U8 获取成功：${text.length} 字符`
    );


    return text;
}


/* =====================================================
   M3U8 解析

   用户要求：

   前 5 行跳过

   从第 6 行开始：

   #EXTINF
   URL

===================================================== */

function parseM3U8(
    text,
    baseUrl
) {

    const rawLines =
        text
            .replace(/\r/g, '')
            .split('\n');


    log(
        `M3U8 共 ${rawLines.length} 行`
    );


    const segments = [];

    let pendingDuration = null;

    let mediaSequence = 0;


    /*
     * 明确从第 6 行开始
     *
     * JS 数组下标：
     *
     * 第6行 = index 5
     */

    for (
        let i = 5;
        i < rawLines.length;
        i++
    ) {

        const line =
            rawLines[i].trim();


        if (!line) {
            continue;
        }


        /* ---------------------------------------------
           MEDIA-SEQUENCE
        --------------------------------------------- */

        if (
            line.startsWith(
                '#EXT-X-MEDIA-SEQUENCE:'
            )
        ) {

            mediaSequence =
                parseInt(
                    line.substring(
                        '#EXT-X-MEDIA-SEQUENCE:'.length
                    ),
                    10
                ) || 0;

            continue;
        }


        /* ---------------------------------------------
           ENDLIST
        --------------------------------------------- */

        if (
            line === '#EXT-X-ENDLIST'
        ) {

            log(
                '发现 #EXT-X-ENDLIST'
            );

            break;
        }


        /* ---------------------------------------------
           EXTINF
        --------------------------------------------- */

        if (
            line.startsWith('#EXTINF:')
        ) {

            const value =
                line.substring(8);


            const durationText =
                value.split(',')[0];


            const duration =
                parseFloat(
                    durationText
                );


            pendingDuration =
                Number.isFinite(duration)
                    ? duration
                    : 10;


            continue;
        }


        /* ---------------------------------------------
           URL

           只有 EXTINF 后面的 URL 才作为分片
        --------------------------------------------- */

        if (
            !line.startsWith('#') &&
            pendingDuration !== null
        ) {

            let segmentUrl;


            try {

                segmentUrl =
                    new URL(
                        line,
                        baseUrl
                    ).href;

            } catch (e) {

                log(
                    '无效分片 URL：' +
                    line
                );

                pendingDuration = null;

                continue;
            }


            segments.push({

                url: segmentUrl,

                duration:
                    pendingDuration,

                sequence:
                    mediaSequence +
                    segments.length
            });


            log(
                `分片 ${segments.length}：${segmentUrl}`
            );


            pendingDuration = null;

            continue;
        }
    }


    if (!segments.length) {

        throw new Error(
            '从第 6 行开始没有找到有效 EXTINF/URL 分片'
        );
    }


    log(
        `✓ 找到 ${segments.length} 个分片`
    );


    return {
        segments,
        mediaSequence
    };
}


/* =====================================================
   创建虚拟 M3U8
===================================================== */

function createVirtualM3U8(
    segments,
    mediaSequence
) {

    let maxDuration = 1;


    for (
        const segment of segments
    ) {

        maxDuration =
            Math.max(
                maxDuration,
                Math.ceil(
                    segment.duration
                )
            );
    }


    const lines = [];


    lines.push(
        '#EXTM3U'
    );


    lines.push(
        '#EXT-X-VERSION:3'
    );


    lines.push(
        '#EXT-X-TARGETDURATION:' +
        maxDuration
    );


    lines.push(
        '#EXT-X-MEDIA-SEQUENCE:' +
        mediaSequence
    );


    for (
        const segment of segments
    ) {

        lines.push(
            '#EXTINF:' +
            segment.duration.toFixed(3) +
            ','
        );


        lines.push(
            segment.url
        );
    }


    lines.push(
        '#EXT-X-ENDLIST'
    );


    return lines.join('\n');
}


/* =====================================================
   TS 检测
===================================================== */

function isMPEGTS(buffer) {

    if (
        !buffer ||
        buffer.byteLength < 188
    ) {

        return false;
    }


    const bytes =
        new Uint8Array(buffer);


    /*
     * MPEG-TS：

     * 188 bytes 一个 packet
     * 同步字节 0x47
     */


    if (
        bytes[0] !== 0x47
    ) {

        return false;
    }


    let matches = 1;


    if (
        bytes.length >= 376 &&
        bytes[188] === 0x47
    ) {

        matches++;
    }


    if (
        bytes.length >= 564 &&
        bytes[376] === 0x47
    ) {

        matches++;
    }


    if (
        bytes.length >= 752 &&
        bytes[564] === 0x47
    ) {

        matches++;
    }


    return matches >= 2;
}


/* =====================================================
   二进制头
===================================================== */

function dumpHeader(buffer) {

    if (!buffer) {
        return '';
    }


    const bytes =
        new Uint8Array(
            buffer,
            0,
            Math.min(
                32,
                buffer.byteLength
            )
        );


    return Array
        .from(bytes)
        .map(
            x =>
                x
                    .toString(16)
                    .padStart(2, '0')
        )
        .join(' ');
}


/* =====================================================
   自定义 Fragment Loader

   非常重要：

   这个 Loader 只负责：

   #EXTINF 后面的实际分片

   不负责 M3U8。
===================================================== */

class TSLoader
    extends Hls.DefaultConfig.loader {


    constructor(config) {

        super(config);

        this.xhr = null;
    }


    destroy() {

        if (this.xhr) {

            try {
                this.xhr.abort();
            } catch (e) {}

            this.xhr = null;
        }


        try {
            super.destroy();
        } catch (e) {}
    }


    abort() {

        if (this.xhr) {

            try {
                this.xhr.abort();
            } catch (e) {}
        }
    }


    load(
        context,
        config,
        callbacks
    ) {

        const url =
            context.url;


        log(
            '--------------------------------'
        );


        log(
            '真正加载 TS 分片：'
        );


        log(
            url
        );


        const xhr =
            new XMLHttpRequest();


        this.xhr =
            xhr;


        /*
         * 读取原始二进制
         */

        xhr.open(
            'GET',
            url,
            true
        );


        xhr.responseType =
            'arraybuffer';


        /*
         * 不根据 .png 判断文件类型。
         *
         * 这里只要求服务端返回内容。
         */

        try {

            xhr.setRequestHeader(
                'Accept',
                '*/*'
            );

        } catch (e) {}


        /*
         * 超时
         */

        xhr.timeout =
            30000;


        /*
         * 成功
         */

        xhr.onload =
            () => {

                if (
                    xhr.status >= 200 &&
                    xhr.status < 300
                ) {

                    const data =
                        xhr.response;


                    if (!data) {

                        log(
                            '❌ HTTP 200，但是 response 为空'
                        );


                        callbacks.onError(
                            {
                                code: 0,
                                text:
                                    'Empty response'
                            },
                            context,
                            null
                        );

                        return;
                    }


                    log(
                        `TS HTTP：${xhr.status}`
                    );


                    log(
                        `TS 文件大小：${data.byteLength} bytes`
                    );


                    log(
                        'TS 文件头：' +
                        dumpHeader(data)
                    );


                    const isTS =
                        isMPEGTS(data);


                    log(
                        'MPEG-TS 检测：' +
                        (
                            isTS
                                ? '✓ 检测成功'
                                : '⚠ 未检测到标准 TS 同步字节'
                        )
                    );


                    /*
                     * 关键：
                     *
                     * 原始 ArrayBuffer
                     *
                     * 不转换成 Blob
                     * 不转换成 PNG
                     * 不转换成字符串
                     *
                     * 直接交给 hls.js。
                     */

                    callbacks.onSuccess(
                        {
                            url: url,

                            data: data
                        },

                        context.stats,

                        context,

                        null
                    );


                } else {

                    log(
                        `❌ TS HTTP 错误：${xhr.status}`
                    );


                    callbacks.onError(
                        {
                            code:
                                xhr.status,

                            text:
                                'HTTP ' +
                                xhr.status
                        },

                        context,

                        null
                    );
                }
            };


        /*
         * 网络错误
         */

        xhr.onerror =
            () => {

                log(
                    '❌ TS 分片网络错误'
                );


                log(
                    '请求地址：' +
                    url
                );


                callbacks.onError(
                    {
                        code: 0,

                        text:
                            'Network Error'
                    },

                    context,

                    null
                );
            };


        /*
         * 超时
         */

        xhr.ontimeout =
            () => {

                log(
                    '❌ TS 分片请求超时'
                );


                callbacks.onError(
                    {
                        code: 0,

                        text:
                            'Timeout'
                    },

                    context,

                    null
                );
            };


        /*
         * 进度
         */

        xhr.onprogress =
            event => {

                if (
                    callbacks.onProgress
                ) {

                    callbacks.onProgress(
                        {
                            loaded:
                                event.loaded,

                            total:
                                event.lengthComputable
                                    ? event.total
                                    : 0,

                            bwEstimate:
                                0
                        },

                        context,

                        null
                    );
                }
            };


        /*
         * 发起请求
         */

        try {

            xhr.send();

        } catch (e) {

            log(
                '❌ xhr.send() 失败：' +
                e.message
            );


            callbacks.onError(
                {
                    code: 0,

                    text:
                        e.message
                },

                context,

                null
            );
        }
    }
}


/* =====================================================
   创建 Blob M3U8
===================================================== */

function createManifestBlob(
    content
) {

    if (manifestBlobUrl) {

        try {

            URL.revokeObjectURL(
                manifestBlobUrl
            );

        } catch (e) {}

        manifestBlobUrl = null;
    }


    const blob =
        new Blob(
            [content],
            {
                type:
                    'application/vnd.apple.mpegurl'
            }
        );


    manifestBlobUrl =
        URL.createObjectURL(
            blob
        );


    return manifestBlobUrl;
}


/* =====================================================
   播放
===================================================== */

async function startPlayer() {

    stopPlayer();

    clearLog();

    playing = true;

    fatalErrorHandled = false;


    const source =
        m3u8Input.value.trim();


    if (!source) {

        log(
            '❌ 请输入 M3U8 地址'
        );

        return;
    }


    log(
        '================================'
    );


    log(
        '开始播放'
    );


    log(
        'M3U8：' +
        source
    );


    try {

        /*
         * 读取 M3U8
         */

        const text =
            await fetchM3U8(
                source
            );


        /*
         * 从第6行开始解析
         */

        const parsed =
            parseM3U8(
                text,
                source
            );


        currentSegments =
            parsed.segments;


        log(
            `总分片：${currentSegments.length}`
        );


        /*
         * 创建虚拟 M3U8
         */

        virtualM3U8 =
            createVirtualM3U8(
                currentSegments,
                parsed.mediaSequence
            );


        log(
            '✓ 已生成虚拟 M3U8'
        );


        /*
         * 调试：显示虚拟 M3U8 前几行
         */

        const debugLines =
            virtualM3U8
                .split('\n')
                .slice(0, 12)
                .join('\n');


        console.log(
            '虚拟 M3U8：\n' +
            debugLines
        );


        /*
         * 浏览器是否支持 MSE
         */

        if (
            !Hls.isSupported()
        ) {

            log(
                '❌ 当前浏览器不支持 MSE'
            );

            return;
        }


        log(
            '✓ 当前浏览器支持 MSE'
        );


        /*
         * Blob M3U8
         */

        const manifestUrl =
            createManifestBlob(
                virtualM3U8
            );


        log(
            '虚拟 M3U8 Blob：' +
            manifestUrl
        );


        /*
         * =================================================
         * 关键修复
         *
         * loader：
         * 默认 Loader
         *
         * fLoader：
         * TSLoader
         *
         * =================================================
         */

        hls =
            new Hls({

                /*
                 * M3U8 使用默认 Loader
                 */

                loader:
                    Hls.DefaultConfig.loader,


                /*
                 * TS Fragment 使用自定义 Loader
                 */

                fLoader:
                    TSLoader,


                enableWorker:
                    true,


                lowLatencyMode:
                    false,


                backBufferLength:
                    30,


                maxBufferLength:
                    30,


                maxBufferSize:
                    60 * 1000 * 1000,


                fragLoadingTimeOut:
                    30000,


                manifestLoadingTimeOut:
                    15000,


                manifestLoadingMaxRetry:
                    2,


                fragLoadingMaxRetry:
                    2
            });


        /*
         * =================================================
         * HLS 事件
         * =================================================
         */


        hls.on(
            Hls.Events.MEDIA_ATTACHED,
            () => {

                log(
                    '✓ 视频已连接到 hls.js'
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_LOADING,
            () => {

                log(
                    '正在加载虚拟 M3U8...'
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_LOADED,
            (
                event,
                data
            ) => {

                log(
                    '✓ 虚拟 M3U8 加载完成'
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            (
                event,
                data
            ) => {

                log(
                    '✓ M3U8 解析成功：' +
                    data.levels.length +
                    ' 个 Level'
                );


                log(
                    '✓ 开始进入 Fragment Loader'
                );


                /*
                 * 不在这里反复调用 play。
                 *
                 * 只尝试一次。
                 */

                const promise =
                    video.play();


                if (
                    promise &&
                    typeof promise.catch ===
                    'function'
                ) {

                    promise.catch(
                        error => {

                            if (
                                error &&
                                error.name ===
                                'AbortError'
                            ) {

                                return;
                            }


                            log(
                                '浏览器阻止自动播放，请点击播放按钮'
                            );
                        }
                    );
                }
            }
        );


        /*
         * Fragment Loading
         */

        hls.on(
            Hls.Events.FRAG_LOADING,
            (
                event,
                data
            ) => {

                const sn =
                    data.frag &&
                    data.frag.sn !== undefined
                        ? data.frag.sn
                        : '?';


                log(
                    '开始加载第 ' +
                    (
                        Number(sn) + 1
                    ) +
                    ' 片'
                );


                if (
                    data.frag &&
                    data.frag.url
                ) {

                    log(
                        '分片 URL：' +
                        data.frag.url
                    );
                }
            }
        );


        /*
         * Fragment Loaded
         */

        hls.on(
            Hls.Events.FRAG_LOADED,
            (
                event,
                data
            ) => {

                let size = 0;


                if (
                    data &&
                    data.payload
                ) {

                    size =
                        data.payload.byteLength ||
                        0;
                }


                log(
                    '✓ Fragment 已交给 hls.js：' +
                    size +
                    ' bytes'
                );
            }
        );


        /*
         * Buffer Created
         */

        hls.on(
            Hls.Events.BUFFER_CREATED,
            () => {

                log(
                    '✓ hls.js Buffer 创建成功'
                );
            }
        );


        /*
         * Level Loaded
         */

        hls.on(
            Hls.Events.LEVEL_LOADED,
            () => {

                log(
                    '✓ Level 加载完成'
                );
            }
        );


        /*
         * HLS Error
         */

        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.error(
                    'HLS ERROR:',
                    data
                );


                log(
                    'HLS错误：' +
                    data.type +
                    ' / ' +
                    data.details +
                    (
                        data.fatal
                            ? ' / FATAL'
                            : ''
                    )
                );


                if (
                    data.frag &&
                    data.frag.url
                ) {

                    log(
                        '错误分片：' +
                        data.frag.url
                    );
                }


                /*
                 * Fatal error
                 */

                if (
                    data.fatal
                ) {

                    if (
                        fatalErrorHandled
                    ) {

                        return;
                    }


                    fatalErrorHandled = true;


                    /*
                     * 网络错误
                     */

                    if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ) {

                        log(
                            '❌ HLS 网络错误'
                        );


                        log(
                            '请检查分片服务器是否允许 CORS'
                        );


                        /*
                         * 不无限 startLoad。
                         *
                         * 否则会不停请求同一个失败分片。
                         */

                        return;
                    }


                    /*
                     * Media Error
                     */

                    if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ) {

                        log(
                            '⚠ HLS Media Error，尝试恢复'
                        );


                        try {

                            hls.recoverMediaError();

                            fatalErrorHandled = false;

                        } catch (e) {

                            log(
                                'Media 恢复失败：' +
                                e.message
                            );
                        }


                        return;
                    }


                    log(
                        '❌ HLS 无法继续播放'
                    );
                }
            }
        );


        /*
         * =================================================
         * attach video
         * =================================================
         */

        hls.attachMedia(
            video
        );


        /*
         * =================================================
         * load manifest
         *
         * 注意：
         *
         * 这里由 DefaultLoader 读取 Blob M3U8
         *
         * 后面的 Fragment 才进入 TSLoader
         * =================================================
         */

        hls.loadSource(
            manifestUrl
        );


        log(
            '✓ hls.js 已启动'
        );


    } catch (error) {

        console.error(
            error
        );


        log(
            '❌ 播放失败：' +
            error.message
        );
    }
}


/* =====================================================
   播放按钮
===================================================== */

playBtn.onclick =
    () => {

        startPlayer();
    };


/* =====================================================
   停止按钮
===================================================== */

stopBtn.onclick =
    () => {

        stopPlayer();
    };


/* =====================================================
   Video Events
===================================================== */

video.addEventListener(
    'error',
    () => {

        if (
            video.error
        ) {

            log(
                'Video错误：' +
                video.error.code +
                ' / ' +
                (
                    video.error.message ||
                    ''
                )
            );
        }
    }
);


video.addEventListener(
    'loadedmetadata',
    () => {

        log(
            '✓ 视频 metadata 加载成功'
        );
    }
);


video.addEventListener(
    'durationchange',
    () => {

        log(
            '视频时长：' +
            video.duration
        );
    }
);


video.addEventListener(
    'canplay',
    () => {

        log(
            '✓ 视频可以开始播放'
        );
    }
);


video.addEventListener(
    'playing',
    () => {

        log(
            '▶ 视频正在播放'
        );
    }
);


video.addEventListener(
    'pause',
    () => {

        /*
         * 不在这里自动 play。
         *
         * 否则 Chrome 会产生：
         *
         * The play() request was interrupted
         */

        log(
            '视频暂停'
        );
    }
);


video.addEventListener(
    'waiting',
    () => {

        log(
            '视频缓冲中...'
        );
    }
);


video.addEventListener(
    'stalled',
    () => {

        log(
            '视频数据加载停滞'
        );
    }
);


/* =====================================================
   初始化
===================================================== */

log(
    'PNG 实际 TS → HLS 播放器已启动'
);


log(
    'M3U8：前 5 行跳过，从第 6 行开始解析'
);


log(
    'Manifest：hls.js 默认 Loader'
);


log(
    'Fragment：自定义 ArrayBuffer Loader'
);


log(
    '不会根据 .png 扩展名判断媒体格式'
);


log(
    '真实二进制直接交给 hls.js'
);

</script>
