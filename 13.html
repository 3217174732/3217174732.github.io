<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PNG → TS HLS 播放器</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
}

.container {
    width: min(1100px, 96%);
    margin: 20px auto;
}

h2 {
    margin: 0 0 15px;
}

video {
    display: block;
    width: 100%;
    max-height: 650px;
    background: #000;
    border-radius: 8px;
}

.panel {
    margin-top: 15px;
    padding: 15px;
    background: #1b1b1b;
    border-radius: 8px;
}

textarea {
    width: 100%;
    min-height: 90px;
    padding: 10px;
    color: #fff;
    background: #111;
    border: 1px solid #444;
    border-radius: 5px;
    resize: vertical;
}

button {
    margin-top: 10px;
    margin-right: 8px;
    padding: 9px 18px;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
}

#playBtn {
    background: #1677ff;
    color: #fff;
}

#stopBtn {
    background: #444;
    color: #fff;
}

.status {
    margin-top: 10px;
    padding: 10px;
    background: #000;
    border-radius: 5px;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: monospace;
    font-size: 13px;
    max-height: 350px;
    overflow-y: auto;
}

.info {
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
}

</style>
</head>

<body>

<div class="container">

    <h2>PNG 实际 TS → HLS 播放器</h2>

    <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>

    <div class="panel">

        <textarea
            id="m3u8Input"
            placeholder="输入 M3U8 地址"
        >https://3217174732.github.io/xxxxx.m3u8</textarea>

        <br>

        <button id="playBtn">
            开始播放
        </button>

        <button id="stopBtn">
            停止播放
        </button>

        <div class="info">
            原理：前端直接读取 PNG URL 的二进制内容，
            如果内容实际是 MPEG-TS，则将 ArrayBuffer
            直接交给 hls.js。
        </div>

        <div
            id="status"
            class="status"
        ></div>

    </div>

</div>


<script>

/*
=========================================================
基础配置
=========================================================
*/

const video =
    document.getElementById('video');

const statusBox =
    document.getElementById('status');

const m3u8Input =
    document.getElementById('m3u8Input');

const playBtn =
    document.getElementById('playBtn');

const stopBtn =
    document.getElementById('stopBtn');


let hls = null;

let currentSegments = [];

let virtualM3U8 = '';

let playing = false;


/*
=========================================================
日志
=========================================================
*/

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    const line =
        `[${time}] ${message}`;

    console.log(line);

    statusBox.textContent +=
        line + '\n';

    statusBox.scrollTop =
        statusBox.scrollHeight;
}


function clearLog() {

    statusBox.textContent = '';

}


/*
=========================================================
停止
=========================================================
*/

function stopPlayer() {

    playing = false;

    if (hls) {

        try {
            hls.destroy();
        } catch (e) {}

        hls = null;
    }

    try {
        video.pause();
    } catch (e) {}

    video.removeAttribute('src');

    try {
        video.load();
    } catch (e) {}

    currentSegments = [];

    virtualM3U8 = '';

    log('播放器已停止');
}


/*
=========================================================
获取 M3U8
=========================================================
*/

async function fetchM3U8(url) {

    log('正在读取 M3U8...');

    const response =
        await fetch(
            url,
            {
                method: 'GET',

                cache: 'no-cache'
            }
        );

    if (!response.ok) {

        throw new Error(
            `M3U8 HTTP ${response.status}`
        );
    }

    const text =
        await response.text();

    log(
        `M3U8 获取成功：${text.length} 字符`
    );

    return text;
}


/*
=========================================================
解析 M3U8
=========================================================

这里不再简单地：

第6行开始全部当 URL。

而是严格按照：

#EXTINF
URL

进行解析。

这样可以避免：

#EXT-X-ENDLIST
和最后一个 URL 粘在一起。
=========================================================
*/

function parseM3U8(text, baseUrl) {

    const lines =
        text
            .replace(/\r/g, '')
            .split('\n')
            .map(x => x.trim())
            .filter(x => x.length > 0);

    const segments = [];

    let pendingDuration = null;

    let mediaSequence = 0;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];


        /*
        -----------------------------------------------
        MEDIA-SEQUENCE
        -----------------------------------------------
        */

        if (
            line.startsWith(
                '#EXT-X-MEDIA-SEQUENCE:'
            )
        ) {

            mediaSequence =
                parseInt(
                    line.substring(
                        '#EXT-X-MEDIA-SEQUENCE:'
                            .length
                    ),
                    10
                ) || 0;

            continue;
        }


        /*
        -----------------------------------------------
        EXTINF
        -----------------------------------------------
        */

        if (
            line.startsWith('#EXTINF:')
        ) {

            const value =
                line.substring(
                    8
                );

            const durationText =
                value.split(',')[0];

            const duration =
                parseFloat(
                    durationText
                );

            pendingDuration =
                Number.isFinite(duration)
                    ? duration
                    : 10;

            continue;
        }


        /*
        -----------------------------------------------
        URL
        -----------------------------------------------
        */

        if (
            !line.startsWith('#') &&
            pendingDuration !== null
        ) {

            let segmentUrl;

            try {

                segmentUrl =
                    new URL(
                        line,
                        baseUrl
                    ).href;

            } catch (e) {

                log(
                    '无效分片 URL：' +
                    line
                );

                pendingDuration = null;

                continue;
            }


            segments.push({

                url: segmentUrl,

                duration:
                    pendingDuration,

                sequence:
                    mediaSequence +
                    segments.length
            });


            log(
                `分片 ${segments.length}：${segmentUrl}`
            );


            pendingDuration = null;

            continue;
        }


        /*
        -----------------------------------------------
        ENDLIST
        -----------------------------------------------
        */

        if (
            line === '#EXT-X-ENDLIST'
        ) {

            log(
                '发现 #EXT-X-ENDLIST'
            );

            break;
        }
    }


    if (!segments.length) {

        throw new Error(
            'M3U8 中没有找到 EXTINF 分片'
        );
    }


    log(
        `✓ 找到 ${segments.length} 个分片`
    );

    return {
        segments,
        mediaSequence
    };
}


/*
=========================================================
生成虚拟 M3U8
=========================================================

注意：

这里把原来的：

xxx.png

改成：

原 URL

但是 hls.js 不直接请求。

真正请求由 TSLoader 完成。

=========================================================
*/

function createVirtualM3U8(
    segments,
    mediaSequence
) {

    let maxDuration = 1;

    for (
        const segment of segments
    ) {

        maxDuration =
            Math.max(
                maxDuration,
                Math.ceil(
                    segment.duration
                )
            );
    }


    const lines = [];

    lines.push(
        '#EXTM3U'
    );

    lines.push(
        '#EXT-X-VERSION:3'
    );

    lines.push(
        '#EXT-X-TARGETDURATION:' +
        maxDuration
    );

    lines.push(
        '#EXT-X-MEDIA-SEQUENCE:' +
        mediaSequence
    );


    for (
        const segment of segments
    ) {

        lines.push(
            '#EXTINF:' +
            segment.duration.toFixed(3) +
            ','
        );

        lines.push(
            segment.url
        );
    }


    lines.push(
        '#EXT-X-ENDLIST'
    );


    return lines.join('\n');
}


/*
=========================================================
TS 检测
=========================================================

MPEG-TS packet 通常为 188 bytes。

同步字节：

0x47

所以检测：

0
188
376
564

=========================================================
*/

function isMPEGTS(buffer) {

    if (
        !buffer ||
        buffer.byteLength < 188
    ) {
        return false;
    }


    const bytes =
        new Uint8Array(buffer);


    if (
        bytes[0] !== 0x47
    ) {
        return false;
    }


    let matches = 1;


    if (
        bytes.length >= 376 &&
        bytes[188] === 0x47
    ) {
        matches++;
    }


    if (
        bytes.length >= 564 &&
        bytes[376] === 0x47
    ) {
        matches++;
    }


    if (
        bytes.length >= 752 &&
        bytes[564] === 0x47
    ) {
        matches++;
    }


    return matches >= 2;
}


/*
=========================================================
打印二进制头
=========================================================
*/

function dumpHeader(buffer) {

    const bytes =
        new Uint8Array(
            buffer,
            0,
            Math.min(
                32,
                buffer.byteLength
            )
        );


    const arr =
        Array.from(
            bytes
        ).map(
            x =>
                x
                    .toString(16)
                    .padStart(2, '0')
        );


    return arr.join(' ');
}


/*
=========================================================
核心：

自定义 hls.js Loader
=========================================================

hls.js 不直接 GET：

xxx.png

而是：

TSLoader
 ↓
XMLHttpRequest
 ↓
responseType=arraybuffer
 ↓
拿真实二进制
 ↓
onSuccess
 ↓
hls.js demuxer

=========================================================
*/

class TSLoader extends Hls.DefaultConfig.loader {

    constructor(config) {

        super(config);

        this.xhr = null;

        this.context = null;

        this.stats = null;
    }


    destroy() {

        if (this.xhr) {

            try {
                this.xhr.abort();
            } catch (e) {}

            this.xhr = null;
        }

        super.destroy();
    }


    abort() {

        if (this.xhr) {

            try {
                this.xhr.abort();
            } catch (e) {}
        }
    }


    load(
        context,
        config,
        callbacks
    ) {

        this.context =
            context;

        this.stats =
            context.stats;


        const url =
            context.url;


        log(
            '加载 TS 分片：' +
            url
        );


        const xhr =
            new XMLHttpRequest();

        this.xhr =
            xhr;


        /*
        -----------------------------------------------
        请求二进制
        -----------------------------------------------
        */

        xhr.open(
            'GET',
            url,
            true
        );


        xhr.responseType =
            'arraybuffer';


        /*
        -----------------------------------------------
        关键：

        浏览器直接读取二进制。

        不根据 .png 判断类型。
        -----------------------------------------------
        */

        xhr.setRequestHeader(
            'Accept',
            '*/*'
        );


        /*
        -----------------------------------------------
        发送
        -----------------------------------------------
        */

        xhr.onload = () => {

            if (
                xhr.status >= 200 &&
                xhr.status < 300
            ) {

                const data =
                    xhr.response;


                log(
                    `HTTP: ${xhr.status}`
                );


                log(
                    `文件大小: ${data.byteLength} bytes`
                );


                log(
                    '文件头：' +
                    dumpHeader(data)
                );


                const ts =
                    isMPEGTS(data);


                log(
                    'MPEG-TS 检测：' +
                    (
                        ts
                            ? '✓ 是 TS'
                            : '⚠ 未检测到标准 TS 同步字节'
                    )
                );


                /*
                ---------------------------------------
                不转换。
                
                如果真实内容本来就是 TS，
                直接交给 hls.js。
                ---------------------------------------
                */

                callbacks.onSuccess(
                    {
                        url: url,

                        data: data
                    },

                    this.stats,

                    context,

                    null
                );


                return;
            }


            log(
                `HTTP错误：${xhr.status}`
            );


            callbacks.onError(
                {
                    code:
                        xhr.status,

                    text:
                        'HTTP ' +
                        xhr.status
                },

                context,

                null
            );
        };


        /*
        -----------------------------------------------
        网络错误
        -----------------------------------------------
        */

        xhr.onerror = () => {

            log(
                'TS 分片加载失败：' +
                'Failed to fetch / Network Error'
            );


            callbacks.onError(
                {
                    code: 0,

                    text:
                        'Network Error'
                },

                context,

                null
            );
        };


        /*
        -----------------------------------------------
        超时
        -----------------------------------------------
        */

        xhr.ontimeout = () => {

            log(
                'TS 分片请求超时'
            );


            callbacks.onError(
                {
                    code: 0,

                    text:
                        'Timeout'
                },

                context,

                null
            );
        };


        /*
        -----------------------------------------------
        进度
        -----------------------------------------------
        */

        xhr.onprogress = event => {

            if (
                callbacks.onProgress
            ) {

                callbacks.onProgress(
                    {
                        loaded:
                            event.loaded,

                        total:
                            event.lengthComputable
                                ? event.total
                                : 0,

                        bwEstimate:
                            0
                    },

                    context,

                    null
                );
            }
        };


        /*
        -----------------------------------------------
        开始
        -----------------------------------------------
        */

        try {

            xhr.send();

        } catch (e) {

            log(
                'XHR send 失败：' +
                e.message
            );


            callbacks.onError(
                {
                    code: 0,

                    text:
                        e.message
                },

                context,

                null
            );
        }
    }
}


/*
=========================================================
把真实 URL 放入虚拟 M3U8
=========================================================

这里使用 Blob URL。

hls.js 加载 manifest 时：
blob://...

manifest 里面：

#EXTINF
https://static.dingtalk.com/xxx.png

但是 fragment 加载阶段会进入 TSLoader。

=========================================================
*/

let manifestBlobUrl =
    null;


function createManifestBlob(
    content
) {

    if (manifestBlobUrl) {

        URL.revokeObjectURL(
            manifestBlobUrl
        );

        manifestBlobUrl = null;
    }


    const blob =
        new Blob(
            [content],
            {
                type:
                    'application/vnd.apple.mpegurl'
            }
        );


    manifestBlobUrl =
        URL.createObjectURL(
            blob
        );


    return manifestBlobUrl;
}


/*
=========================================================
播放
=========================================================
*/

async function startPlayer() {

    stopPlayer();

    clearLog();

    playing = true;


    const source =
        m3u8Input.value.trim();


    if (!source) {

        log(
            '请输入 M3U8 地址'
        );

        return;
    }


    log(
        '================================'
    );

    log(
        '开始播放'
    );

    log(
        'M3U8：' +
        source
    );


    try {

        /*
        -----------------------------------------------
        读取原始 M3U8
        -----------------------------------------------
        */

        const text =
            await fetchM3U8(
                source
            );


        /*
        -----------------------------------------------
        解析
        -----------------------------------------------
        */

        const parsed =
            parseM3U8(
                text,
                source
            );


        currentSegments =
            parsed.segments;


        log(
            `总分片：${currentSegments.length}`
        );


        /*
        -----------------------------------------------
        生成虚拟 M3U8
        -----------------------------------------------
        */

        virtualM3U8 =
            createVirtualM3U8(
                currentSegments,
                parsed.mediaSequence
            );


        log(
            '✓ 已生成虚拟 M3U8'
        );


        /*
        -----------------------------------------------
        检查 MSE
        -----------------------------------------------
        */

        if (
            !Hls.isSupported()
        ) {

            log(
                '当前浏览器不支持 MSE'
            );

            return;
        }


        log(
            '✓ 当前浏览器支持 MSE'
        );


        /*
        -----------------------------------------------
        创建 Blob M3U8
        -----------------------------------------------
        */

        const manifestUrl =
            createManifestBlob(
                virtualM3U8
            );


        /*
        -----------------------------------------------
        HLS
        -----------------------------------------------
        */

        hls =
            new Hls({

                /*
                 * 最关键：
                 *
                 * manifest 使用默认 Loader
                 *
                 * fragment 使用 TSLoader
                 */
                loader:
                    TSLoader,

                enableWorker:
                    true,

                lowLatencyMode:
                    false,

                backBufferLength:
                    30,

                maxBufferLength:
                    30,

                maxBufferSize:
                    60 * 1000 * 1000,

                fragLoadingTimeOut:
                    20000,

                manifestLoadingTimeOut:
                    10000,

                manifestLoadingMaxRetry:
                    2,

                fragLoadingMaxRetry:
                    2
            });


        /*
        -----------------------------------------------
        HLS事件
        -----------------------------------------------
        */

        hls.on(
            Hls.Events.MEDIA_ATTACHED,
            () => {

                log(
                    '✓ 视频已连接到 hls.js'
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_LOADING,
            () => {

                log(
                    '正在加载虚拟 M3U8...'
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_LOADED,
            () => {

                log(
                    '✓ 虚拟 M3U8 加载完成'
                );
            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            (
                event,
                data
            ) => {

                log(
                    '✓ M3U8 解析成功：' +
                    data.levels.length +
                    ' 个 Level'
                );


                log(
                    '准备加载 TS 分片'
                );


                /*
                ---------------------------------------
                自动播放
                ---------------------------------------
                */

                video.play()
                    .then(() => {

                        log(
                            '✓ 自动播放成功'
                        );

                    })
                    .catch(error => {

                        log(
                            '浏览器阻止自动播放，请点击播放'
                        );

                        console.log(
                            error
                        );
                    });
            }
        );


        hls.on(
            Hls.Events.FRAG_LOADING,
            (
                event,
                data
            ) => {

                log(
                    '开始加载第 ' +
                    (
                        data.frag.sn + 1
                    ) +
                    ' 片'
                );


                log(
                    '分片网址：' +
                    data.frag.url
                );
            }
        );


        hls.on(
            Hls.Events.FRAG_LOADED,
            (
                event,
                data
            ) => {

                const size =
                    data.payload
                        ? data.payload.byteLength
                        : 0;


                log(
                    '✓ TS 分片加载成功：' +
                    size +
                    ' bytes'
                );
            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.error(
                    'HLS ERROR',
                    data
                );


                log(
                    'HLS错误：' +
                    data.type +
                    ' / ' +
                    data.details +
                    (
                        data.fatal
                            ? ' / FATAL'
                            : ''
                    )
                );


                if (
                    data.frag &&
                    data.frag.url
                ) {

                    log(
                        '错误分片：' +
                        data.frag.url
                    );
                }


                /*
                ---------------------------------------
                FATAL 网络错误
                ---------------------------------------
                */

                if (
                    data.fatal
                ) {

                    if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ) {

                        log(
                            '⚠ HLS 网络错误，尝试恢复'
                        );


                        try {

                            hls.startLoad();

                        } catch (e) {

                            log(
                                '恢复失败：' +
                                e.message
                            );
                        }


                        return;
                    }


                    if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ) {

                        log(
                            '⚠ HLS Media Error，尝试 recoverMediaError()'
                        );


                        try {

                            hls.recoverMediaError();

                        } catch (e) {

                            log(
                                'Media 恢复失败：' +
                                e.message
                            );
                        }


                        return;
                    }


                    log(
                        '❌ HLS 无法继续播放'
                    );
                }
            }
        );


        /*
        -----------------------------------------------
        attach video
        -----------------------------------------------
        */

        hls.attachMedia(
            video
        );


        /*
        -----------------------------------------------
        加载虚拟 M3U8
        -----------------------------------------------
        */

        hls.loadSource(
            manifestUrl
        );


        log(
            '✓ hls.js 已启动'
        );


    } catch (error) {

        console.error(
            error
        );


        log(
            '播放失败：' +
            error.message
        );
    }
}


/*
=========================================================
按钮
=========================================================
*/

playBtn.onclick =
    () => {

        startPlayer();
    };


stopBtn.onclick =
    () => {

        stopPlayer();
    };


/*
=========================================================
Video 事件
=========================================================
*/

video.addEventListener(
    'error',
    () => {

        if (
            video.error
        ) {

            log(
                'Video错误：' +
                video.error.code +
                ' / ' +
                video.error.message
            );
        }
    }
);


video.addEventListener(
    'loadedmetadata',
    () => {

        log(
            '✓ 视频 metadata 加载成功'
        );
    }
);


video.addEventListener(
    'canplay',
    () => {

        log(
            '✓ 视频可以开始播放'
        );
    }
);


video.addEventListener(
    'playing',
    () => {

        log(
            '▶ 视频正在播放'
        );
    }
);


video.addEventListener(
    'waiting',
    () => {

        log(
            '视频缓冲中...'
        );
    }
);


/*
=========================================================
初始化日志
=========================================================
*/

log(
    'PNG 实际 TS HLS 播放器已启动'
);

log(
    '工作模式：原始 M3U8 → 前端 ArrayBuffer → hls.js'
);

log(
    '不会根据 .png 扩展名判断文件格式'
);

log(
    '会直接读取分片二进制内容'
);

</script>

</body>
</html>
