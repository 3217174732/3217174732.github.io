<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PNG 伪装 TS HLS 播放器</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

body {
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

#videoWrap {
    position: relative;
    width: 100%;
    background: #000;
    flex: 1;
    min-height: 0;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
}

#loading {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 18px;
    background: rgba(0, 0, 0, .75);
    border-radius: 8px;
    font-size: 14px;
    z-index: 10;
}

#playButton {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: none;
    border: 0;
    border-radius: 50%;
    width: 72px;
    height: 72px;
    background: rgba(255,255,255,.95);
    color: #111;
    font-size: 28px;
    cursor: pointer;
    z-index: 20;
}

#panel {
    flex: 0 0 260px;
    background: #111;
    border-top: 1px solid #333;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#urlBox {
    width: 100%;
    height: 38px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #181818;
    color: #fff;
    padding: 0 10px;
    outline: none;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

button.action {
    border: 0;
    border-radius: 6px;
    background: #2d7ff9;
    color: #fff;
    padding: 8px 14px;
    cursor: pointer;
}

button.action:hover {
    opacity: .85;
}

#log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #080808;
    border: 1px solid #292929;
    border-radius: 6px;
    padding: 8px;
    font-family: Consolas, Monaco, monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
}

.log-ok {
    color: #69e36d;
}

.log-warn {
    color: #ffd166;
}

.log-error {
    color: #ff6666;
}

.log-info {
    color: #ddd;
}

@media (max-width: 700px) {

    #panel {
        flex-basis: 300px;
    }

}
</style>
</head>

<body>

<div id="app">

    <div id="videoWrap">

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline
            preload="auto"
        ></video>

        <div id="loading">
            等待播放
        </div>

        <button id="playButton">
            ▶
        </button>

    </div>

    <div id="panel">

        <input
            id="urlBox"
            type="text"
            value="https://3217174732.github.io/xxxxx.m3u8"
            placeholder="M3U8 地址"
        >

        <div class="buttons">

            <button
                class="action"
                id="startBtn"
            >
                开始播放
            </button>

            <button
                class="action"
                id="stopBtn"
            >
                停止
            </button>

            <button
                class="action"
                id="clearBtn"
            >
                清空日志
            </button>

        </div>

        <div id="log"></div>

    </div>

</div>


<!-- hls.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


<script>

"use strict";


/* =========================================================
 *
 * 基本配置
 *
 * ========================================================= */

const CONFIG = {

    /* 最大重试次数 */
    fragmentRetry: 3,

    /* 重试间隔 */
    fragmentRetryDelay: 1000,

    /* 请求超时 */
    fragmentTimeout: 15000,

    /* 阿里云播放器诊断页 */
    aliyunPlayer:
        "https://video.aliyuncs.com/player-detection/index.html?source=",

    /* 是否打印 TS 检测 */
    debugTS: true,

    /* 最大日志数量 */
    maxLogs: 500

};


/* =========================================================
 *
 * DOM
 *
 * ========================================================= */

const video =
    document.getElementById("video");

const logBox =
    document.getElementById("log");

const loading =
    document.getElementById("loading");

const playButton =
    document.getElementById("playButton");

const urlBox =
    document.getElementById("urlBox");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const clearBtn =
    document.getElementById("clearBtn");


/* =========================================================
 *
 * 全局状态
 *
 * ========================================================= */

let hls = null;

let destroyed = false;

let playing = false;

let sourceM3U8 = "";

let segments = [];

let nativeTried = false;

let hlsTried = false;

let aliyunTried = false;

let fragmentRetryMap = new Map();


/* =========================================================
 *
 * 日志
 *
 * ========================================================= */

function log(message, type = "info") {

    const time =
        new Date().toLocaleTimeString();

    const div =
        document.createElement("div");

    div.className =
        type === "ok"
            ? "log-ok"
            : type === "warn"
                ? "log-warn"
                : type === "error"
                    ? "log-error"
                    : "log-info";

    div.textContent =
        `[${time}] ${message}`;

    logBox.appendChild(div);

    while (
        logBox.children.length >
        CONFIG.maxLogs
    ) {
        logBox.removeChild(
            logBox.firstChild
        );
    }

    logBox.scrollTop =
        logBox.scrollHeight;

}


function clearLogs() {

    logBox.innerHTML = "";

}


/* =========================================================
 *
 * 浏览器检测
 *
 * ========================================================= */

function detectBrowser() {

    const ua =
        navigator.userAgent;

    const isChrome =
        /Chrome|CriOS/i.test(ua) &&
        !/Edg|OPR|Opera|SamsungBrowser/i.test(ua);

    const isEdge =
        /Edg/i.test(ua);

    const isFirefox =
        /Firefox|FxiOS/i.test(ua);

    const isSafari =
        /Safari/i.test(ua) &&
        !/Chrome|CriOS/i.test(ua);

    log(
        "浏览器：" +
        (
            isChrome
                ? "Chrome"
                : isEdge
                    ? "Edge"
                    : isFirefox
                        ? "Firefox"
                        : isSafari
                            ? "Safari"
                            : "其他"
        )
    );

    if (isChrome) {

        log(
            "✓ 检测到 Google Chrome",
            "ok"
        );

    }

    return {
        isChrome,
        isEdge,
        isFirefox,
        isSafari
    };

}


/* =========================================================
 *
 * MSE 检测
 *
 * ========================================================= */

function detectMSE() {

    const supported =
        typeof window.MediaSource !== "undefined";

    if (supported) {

        log(
            "✓ 当前浏览器支持 MSE",
            "ok"
        );

    } else {

        log(
            "❌ 当前浏览器不支持 MSE",
            "error"
        );

    }

    return supported;

}


/* =========================================================
 *
 * 停止
 *
 * ========================================================= */

function stopPlayer() {

    destroyed = true;

    playing = false;

    nativeTried = false;

    hlsTried = false;

    aliyunTried = false;

    fragmentRetryMap.clear();

    if (hls) {

        try {
            hls.destroy();
        } catch (e) {}

        hls = null;

    }

    try {

        video.pause();

        video.removeAttribute("src");

        video.load();

    } catch (e) {}

    loading.style.display = "block";

    loading.textContent =
        "播放器已停止";

    playButton.style.display =
        "none";

    log(
        "播放器已停止"
    );

}


/* =========================================================
 *
 * 获取原始 M3U8
 *
 * ========================================================= */

async function fetchText(url) {

    const response =
        await fetch(
            url,
            {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status} ${response.statusText}`
        );

    }

    return await response.text();

}


/* =========================================================
 *
 * 解析 M3U8
 *
 * ========================================================= */

function parseOriginalM3U8(text, baseURL) {

    const lines =
        text
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(x => x.length > 0);

    const result = [];

    let pendingDuration = null;

    let mediaSequence = 0;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line = lines[i];

        if (
            line.startsWith(
                "#EXT-X-MEDIA-SEQUENCE:"
            )
        ) {

            const value =
                line.substring(
                    "#EXT-X-MEDIA-SEQUENCE:"
                        .length
                );

            const n =
                parseInt(value, 10);

            if (!Number.isNaN(n)) {

                mediaSequence = n;

            }

            continue;

        }


        if (
            line.startsWith("#EXTINF:")
        ) {

            const value =
                line.substring(8);

            const durationText =
                value.split(",")[0];

            const duration =
                parseFloat(durationText);

            if (
                Number.isFinite(duration) &&
                duration > 0
            ) {

                pendingDuration =
                    duration;

            }

            continue;

        }


        if (
            line.startsWith("#")
        ) {

            continue;

        }


        /*
         * 到这里说明是 URI
         */

        if (
            pendingDuration === null
        ) {

            log(
                `跳过没有 EXTINF 的 URL：${line}`,
                "warn"
            );

            continue;

        }


        let url;

        try {

            url =
                new URL(
                    line,
                    baseURL
                ).href;

        } catch (e) {

            log(
                `无效分片 URL：${line}`,
                "error"
            );

            pendingDuration = null;

            continue;

        }


        result.push({

            duration:
                pendingDuration,

            url

        });


        pendingDuration = null;

    }


    return {
        segments: result,
        mediaSequence
    };

}


/* =========================================================
 *
 * 生成严格合法的虚拟 M3U8
 *
 * ========================================================= */

function buildVirtualM3U8(
    list,
    mediaSequence = 0
) {

    if (!list.length) {

        throw new Error(
            "没有找到任何分片"
        );

    }


    /*
     * TARGETDURATION 必须 >= 最大 EXTINF
     */

    let maxDuration = 0;

    for (const item of list) {

        if (
            item.duration >
            maxDuration
        ) {

            maxDuration =
                item.duration;

        }

    }


    const targetDuration =
        Math.ceil(maxDuration);


    const lines = [

        "#EXTM3U",

        "#EXT-X-VERSION:3",

        `#EXT-X-TARGETDURATION:${targetDuration}`,

        `#EXT-X-MEDIA-SEQUENCE:${mediaSequence}`

    ];


    for (
        let i = 0;
        i < list.length;
        i++
    ) {

        const item = list[i];

        lines.push(
            `#EXTINF:${item.duration.toFixed(3)},`
        );

        lines.push(
            item.url
        );

    }


    /*
     * ENDLIST 必须是最后一行
     */

    lines.push(
        "#EXT-X-ENDLIST"
    );


    const m3u8 =
        lines.join("\n") +
        "\n";


    return m3u8;

}


/* =========================================================
 *
 * 检测 MPEG-TS
 *
 * ========================================================= */

function inspectTS(buffer) {

    if (!buffer) {

        return {
            valid: false,
            reason: "空数据"
        };

    }


    const bytes =
        new Uint8Array(buffer);


    if (bytes.length < 188) {

        return {
            valid: false,
            reason:
                `数据只有 ${bytes.length} bytes`
        };

    }


    /*
     * MPEG-TS 通常以 188 bytes 为 packet。
     *
     * 第一个 packet：
     *
     * byte[0] == 0x47
     *
     * 如果是连续 TS，
     * 188 / 376 / 564 ... 位置
     * 也应该经常出现 0x47。
     */

    let sync188 = 0;

    const checkCount =
        Math.min(
            10,
            Math.floor(
                bytes.length / 188
            )
        );


    for (
        let i = 0;
        i < checkCount;
        i++
    ) {

        if (
            bytes[i * 188] === 0x47
        ) {

            sync188++;

        }

    }


    /*
     * 有些 TS 可能前面存在少量非 TS 数据。
     * 搜索前 1KB 的同步字节。
     */

    let firstSync = -1;

    const searchLength =
        Math.min(
            bytes.length,
            1024
        );


    for (
        let i = 0;
        i < searchLength;
        i++
    ) {

        if (
            bytes[i] === 0x47
        ) {

            let valid = true;

            if (
                i + 188 <
                bytes.length
            ) {

                if (
                    bytes[i + 188] !== 0x47
                ) {

                    valid = false;

                }

            }


            if (
                i + 376 <
                bytes.length
            ) {

                if (
                    bytes[i + 376] !== 0x47
                ) {

                    valid = false;

                }

            }


            if (valid) {

                firstSync = i;

                break;

            }

        }

    }


    return {

        valid:
            sync188 >= 2 ||
            firstSync >= 0,

        size:
            bytes.length,

        sync188,

        firstSync

    };

}


/* =========================================================
 *
 * 自定义 TS Fragment Loader
 *
 * 核心：
 *
 * URL 虽然是 .png
 *
 * 但是：
 *
 * fetch → ArrayBuffer
 *
 * 不看文件扩展名
 *
 * ========================================================= */

class PngNamedTsLoader
    extends Hls.DefaultConfig.loader {

    constructor(config) {

        super(config);

        this.controller = null;

        this.aborted = false;

    }


    load(
        context,
        config,
        callbacks
    ) {

        this.aborted = false;


        const url =
            context.url;


        /*
         * 只有 Fragment 才进入这里。
         */

        if (
            context.frag ||
            context.type === "fragment"
        ) {

            this.loadTSFragment(
                context,
                config,
                callbacks
            );

            return;

        }


        /*
         * Manifest 等其他请求，
         * 使用 hls.js 默认 Loader。
         */

        super.load(
            context,
            config,
            callbacks
        );

    }


    async loadTSFragment(
        context,
        config,
        callbacks
    ) {

        const startTime =
            performance.now();


        let timeoutId =
            null;


        try {

            log(
                `加载 TS 分片：${shortURL(context.url)}`,
                "info"
            );


            this.controller =
                new AbortController();


            timeoutId =
                setTimeout(
                    () => {

                        try {

                            this.controller.abort();

                        } catch (e) {}

                    },
                    CONFIG.fragmentTimeout
                );


            const response =
                await fetch(
                    context.url,
                    {
                        method: "GET",

                        mode: "cors",

                        credentials: "omit",

                        cache: "no-store",

                        signal:
                            this.controller.signal,

                        headers: {

                            /*
                             * 明确告诉服务器，
                             * 我们接受二进制。
                             */

                            "Accept":
                                "*/*"

                        }
                    }
                );


            if (timeoutId) {

                clearTimeout(timeoutId);

                timeoutId = null;

            }


            if (this.aborted) {

                return;

            }


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status} ${response.statusText}`
                );

            }


            const buffer =
                await response.arrayBuffer();


            if (this.aborted) {

                return;

            }


            const info =
                inspectTS(buffer);


            if (CONFIG.debugTS) {

                log(
                    `TS分片大小：${info.size} bytes` +
                    `，188字节同步包：${info.sync188}` +
                    `，首同步位置：${info.firstSync}`,
                    info.valid
                        ? "ok"
                        : "warn"
                );

            }


            if (!info.valid) {

                /*
                 * 这里不要直接阻止播放。
                 *
                 * 因为某些 TS 前面可能有自定义数据。
                 *
                 * 交给 hls.js 再判断。
                 */

                log(
                    "⚠ 当前分片未检测到标准 TS 同步结构，继续交给 hls.js",
                    "warn"
                );

            } else {

                log(
                    "✓ 分片确认包含 MPEG-TS 数据",
                    "ok"
                );

            }


            const endTime =
                performance.now();


            /*
             * hls.js LoaderCallbacks
             * 需要 stats。
             *
             * 这里提供兼容对象。
             */

            const stats = {

                aborted: false,

                loaded:
                    buffer.byteLength,

                total:
                    buffer.byteLength,

                retry: 0,

                loading: {

                    start:
                        startTime,

                    first:
                        endTime,

                    end:
                        endTime

                },

                parsing: {

                    start: 0,

                    end: 0

                },

                buffering: {

                    start: 0,

                    first: 0,

                    end: 0

                }

            };


            callbacks.onSuccess(

                {
                    url:
                        context.url,

                    data:
                        buffer

                },

                stats,

                context,

                null

            );

        } catch (error) {

            if (timeoutId) {

                clearTimeout(timeoutId);

            }


            if (
                this.aborted
            ) {

                return;

            }


            log(
                `TS分片加载失败：${error.message}`,
                "error"
            );


            const stats = {

                aborted: false,

                loaded: 0,

                total: 0,

                retry: 0,

                loading: {

                    start:
                        startTime,

                    first:
                        0,

                    end:
                        performance.now()

                },

                parsing: {

                    start: 0,

                    end: 0

                },

                buffering: {

                    start: 0,

                    first: 0,

                    end: 0

                }

            };


            callbacks.onError(

                {
                    code:
                        0,

                    text:
                        error.message

                },

                context,

                null

            );

        }

    }


    abort() {

        this.aborted = true;

        try {

            if (this.controller) {

                this.controller.abort();

            }

        } catch (e) {}

    }


    destroy() {

        this.abort();

        this.controller = null;

    }

}


/* =========================================================
 *
 * URL 缩短
 *
 * ========================================================= */

function shortURL(url) {

    try {

        const u =
            new URL(url);

        const path =
            u.pathname;

        if (
            path.length > 60
        ) {

            return (
                u.origin +
                "/..." +
                path.slice(-45)
            );

        }

        return url;

    } catch (e) {

        return url;

    }

}


/* =========================================================
 *
 * 原生 H5
 *
 * ========================================================= */

async function tryNativeH5() {

    if (destroyed) {
        return false;
    }


    nativeTried = true;


    log(
        "① 开始尝试原生 H5 播放"
    );


    /*
     * 原始 M3U8 不是标准 HLS 媒体类型，
     * 而且分片是 .png。
     *
     * 因此这里只作为第一层尝试。
     */

    return new Promise(resolve => {

        let done = false;


        const finish =
            success => {

                if (done) {
                    return;
                }

                done = true;

                video.onloadedmetadata = null;
                video.onerror = null;

                resolve(success);

            };


        video.onloadedmetadata =
            () => {

                log(
                    "✓ 原生 H5 成功识别媒体",
                    "ok"
                );

                finish(true);

            };


        video.onerror =
            () => {

                const code =
                    video.error
                        ? video.error.code
                        : 0;

                log(
                    `原生 H5 视频错误：${code}`,
                    "warn"
                );

                finish(false);

            };


        try {

            video.src =
                sourceM3U8;

            video.load();


            const p =
                video.play();


            if (p) {

                p.catch(() => {

                    log(
                        "浏览器阻止自动播放，请点击播放按钮",
                        "warn"
                    );

                    playButton.style.display =
                        "block";

                });

            }


            /*
             * 原生 H5 最多等 4 秒。
             */

            setTimeout(
                () => {

                    if (!done) {

                        log(
                            "原生 H5 未能启动，切换 hls.js",
                            "warn"
                        );

                        finish(false);

                    }

                },
                4000
            );

        } catch (e) {

            log(
                "原生 H5 启动异常：" +
                e.message,
                "warn"
            );

            finish(false);

        }

    });

}


/* =========================================================
 *
 * hls.js
 *
 * ========================================================= */

async function tryHlsJS() {

    if (destroyed) {
        return false;
    }


    hlsTried = true;


    log(
        "② 原生 H5 播放失败"
    );


    log(
        "③ 切换到 hls.js"
    );


    if (
        typeof Hls === "undefined"
    ) {

        log(
            "❌ hls.js 未加载",
            "error"
        );

        return false;

    }


    if (
        !Hls.isSupported()
    ) {

        log(
            "❌ 当前浏览器不支持 hls.js",
            "error"
        );

        return false;

    }


    log(
        "✓ hls.js 环境支持"
    );


    /*
     * 创建 hls。
     *
     * loader：
     * Manifest 等使用默认 Loader。
     *
     * fLoader：
     * Fragment 使用我们的
     * PngNamedTsLoader。
     */

    try {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30,

                maxBufferLength: 60,

                maxMaxBufferLength: 120,

                manifestLoadingMaxRetry: 2,

                manifestLoadingRetryDelay: 1000,

                fragLoadingMaxRetry: 3,

                fragLoadingRetryDelay: 1000,

                loader:
                    Hls.DefaultConfig.loader,

                fLoader:
                    PngNamedTsLoader

            });

    } catch (e) {

        log(
            "❌ 创建 hls.js 失败：" +
            e.message,
            "error"
        );

        return false;

    }


    /*
     * MEDIA_ATTACHED
     */

    hls.on(
        Hls.Events.MEDIA_ATTACHED,
        () => {

            log(
                "✓ 视频已连接到 hls.js",
                "ok"
            );

            log(
                "hls.js Fragment Loader：PNG → ArrayBuffer → TS"
            );

        }
    );


    /*
     * MANIFEST_LOADING
     */

    hls.on(
        Hls.Events.MANIFEST_LOADING,
        () => {

            log(
                "正在加载虚拟 M3U8..."
            );

        }
    );


    /*
     * MANIFEST_PARSED
     */

    hls.on(
        Hls.Events.MANIFEST_PARSED,
        (event, data) => {

            log(
                `✓ M3U8 解析成功：${data.levels.length} 个 Level`,
                "ok"
            );


            if (
                data.levels.length > 0
            ) {

                log(
                    `✓ 视频轨道：${data.levels[0].width || "未知"}x${data.levels[0].height || "未知"}`
                );

            }


            loading.textContent =
                "正在缓冲视频...";


            /*
             * 自动播放。
             */

            video.play()
                .then(() => {

                    log(
                        "✓ 视频开始播放",
                        "ok"
                    );

                    loading.style.display =
                        "none";

                    playButton.style.display =
                        "none";

                })
                .catch(() => {

                    log(
                        "浏览器阻止自动播放，请点击播放",
                        "warn"
                    );

                    loading.style.display =
                        "none";

                    playButton.style.display =
                        "block";

                });

        }
    );


    /*
     * FRAG_LOADING
     */

    hls.on(
        Hls.Events.FRAG_LOADING,
        (event, data) => {

            if (
                data &&
                data.frag
            ) {

                const sn =
                    data.frag.sn;

                log(
                    `开始加载第 ${sn + 1} 片`
                );

            }

        }
    );


    /*
     * FRAG_LOADED
     */

    hls.on(
        Hls.Events.FRAG_LOADED,
        (event, data) => {

            if (
                data &&
                data.frag
            ) {

                log(
                    `✓ 第 ${data.frag.sn + 1} 片加载完成`,
                    "ok"
                );

            }

        }
    );


    /*
     * BUFFER_CREATED
     */

    hls.on(
        Hls.Events.BUFFER_CREATED,
        () => {

            log(
                "✓ MSE Buffer 已创建",
                "ok"
            );

        }
    );


    /*
     * ERROR
     */

    hls.on(
        Hls.Events.ERROR,
        (event, data) => {

            console.error(
                "hls.js ERROR",
                data
            );


            const type =
                data.type || "unknown";

            const details =
                data.details || "unknown";

            const fatal =
                !!data.fatal;


            log(
                `HLS错误：${type} / ${details}` +
                (fatal ? " / FATAL" : ""),
                fatal
                    ? "error"
                    : "warn"
            );


            if (
                data.frag &&
                data.frag.url
            ) {

                log(
                    `错误分片：${shortURL(data.frag.url)}`
                );

            }


            /*
             * Fatal network error
             */

            if (
                fatal &&
                type === Hls.ErrorTypes.NETWORK_ERROR
            ) {

                log(
                    "⚠ HLS 网络错误，尝试恢复",
                    "warn"
                );


                try {

                    hls.startLoad();

                } catch (e) {

                    log(
                        "hls.startLoad() 失败：" +
                        e.message,
                        "error"
                    );

                    fallbackAliyun();

                }


                return;

            }


            /*
             * Fatal media error
             */

            if (
                fatal &&
                type === Hls.ErrorTypes.MEDIA_ERROR
            ) {

                log(
                    "⚠ HLS MediaError，尝试 recoverMediaError()",
                    "warn"
                );


                try {

                    hls.recoverMediaError();

                } catch (e) {

                    log(
                        "MediaError 恢复失败",
                        "error"
                    );

                    fallbackAliyun();

                }


                return;

            }


            /*
             * 其他 fatal
             */

            if (fatal) {

                log(
                    "❌ hls.js 无法继续播放",
                    "error"
                );

                fallbackAliyun();

            }

        }
    );


    /*
     * 开始播放
     */

    try {

        hls.attachMedia(video);


        /*
         * 用 Blob URL 提供虚拟 M3U8。
         *
         * 这样：
         *
         * hls.js manifest loader
         * ↓
         * Blob
         *
         * Fragment URL
         * ↓
         * 真实 PNG URL
         */

        const blob =
            new Blob(
                [virtualM3U8],
                {
                    type:
                        "application/vnd.apple.mpegurl"
                }
            );


        const virtualURL =
            URL.createObjectURL(blob);


        log(
            "✓ 已生成虚拟 M3U8"
        );


        hls.loadSource(
            virtualURL
        );


        log(
            "✓ 已交给 hls.js 加载"
        );


        return true;

    } catch (e) {

        log(
            "❌ hls.js 启动异常：" +
            e.message,
            "error"
        );

        try {

            hls.destroy();

        } catch (e2) {}

        hls = null;

        return false;

    }

}


/* =========================================================
 *
 * 阿里云 H5 fallback
 *
 * ========================================================= */

function fallbackAliyun() {

    if (
        aliyunTried
    ) {

        return;

    }


    aliyunTried = true;


    log(
        "④ hls.js 无法继续播放"
    );


    log(
        "⑤ 切换到阿里云原生 H5",
        "warn"
    );


    try {

        if (hls) {

            hls.destroy();

            hls = null;

        }

    } catch (e) {}


    const url =
        CONFIG.aliyunPlayer +
        encodeURIComponent(
            sourceM3U8
        );


    log(
        "阿里云来源：" +
        sourceM3U8
    );


    log(
        "正在打开阿里云播放器诊断页面..."
    );


    window.location.href =
        url;

}


/* =========================================================
 *
 * 主播放流程
 *
 * ========================================================= */

let virtualM3U8 = "";


async function startPlayer() {

    stopPlayer();


    destroyed = false;

    playing = true;

    sourceM3U8 =
        urlBox.value.trim();


    if (!sourceM3U8) {

        log(
            "❌ M3U8 地址为空",
            "error"
        );

        return;

    }


    log(
        "================================"
    );


    log(
        "开始播放"
    );


    log(
        "M3U8：" +
        sourceM3U8
    );


    detectBrowser();

    detectMSE();


    loading.style.display =
        "block";

    loading.textContent =
        "正在读取 M3U8...";


    /*
     * =====================================================
     * 读取 M3U8
     * =====================================================
     */

    let text;

    try {

        text =
            await fetchText(
                sourceM3U8
            );

    } catch (e) {

        log(
            "❌ M3U8 获取失败：" +
            e.message,
            "error"
        );

        loading.textContent =
            "M3U8 加载失败";

        return;

    }


    log(
        `✓ M3U8 获取成功：${text.length} 字符`,
        "ok"
    );


    /*
     * =====================================================
     * 解析
     * =====================================================
     */

    let parsed;

    try {

        parsed =
            parseOriginalM3U8(
                text,
                sourceM3U8
            );

    } catch (e) {

        log(
            "❌ M3U8 解析失败：" +
            e.message,
            "error"
        );

        return;

    }


    segments =
        parsed.segments;


    log(
        `✓ 找到 ${segments.length} 个分片`,
        "ok"
    );


    if (!segments.length) {

        log(
            "❌ 没有找到任何 EXTINF 分片",
            "error"
        );

        return;

    }


    /*
     * 只打印前 3 个和最后 1 个
     */

    for (
        let i = 0;
        i < Math.min(3, segments.length);
        i++
    ) {

        log(
            `分片 ${i + 1}：${shortURL(segments[i].url)}`
        );

    }


    if (
        segments.length > 3
    ) {

        log(
            `... 中间 ${segments.length - 4} 个分片省略`
        );

        log(
            `最后分片：${shortURL(
                segments[segments.length - 1].url
            )}`
        );

    }


    /*
     * =====================================================
     * 生成虚拟 M3U8
     * =====================================================
     */

    try {

        virtualM3U8 =
            buildVirtualM3U8(
                segments,
                parsed.mediaSequence
            );

    } catch (e) {

        log(
            "❌ 虚拟 M3U8 生成失败：" +
            e.message,
            "error"
        );

        return;

    }


    log(
        "✓ 虚拟 M3U8 生成完成",
        "ok"
    );


    /*
     * 检查 ENDLIST
     */

    const endlistCount =
        (
            virtualM3U8.match(
                /#EXT-X-ENDLIST/g
            ) || []
        ).length;


    log(
        `ENDLIST 数量：${endlistCount}`
    );


    if (
        endlistCount !== 1
    ) {

        log(
            "❌ M3U8 ENDLIST 数量异常",
            "error"
        );

        return;

    }


    /*
     * =====================================================
     * 第一层：原生 H5
     * =====================================================
     */

    const nativeOK =
        await tryNativeH5();


    if (
        nativeOK
    ) {

        loading.style.display =
            "none";

        log(
            "✓ 原生 H5 播放成功",
            "ok"
        );

        return;

    }


    /*
     * =====================================================
     * 第二层：hls.js
     * =====================================================
     */

    const hlsOK =
        await tryHlsJS();


    if (
        !hlsOK
    ) {

        fallbackAliyun();

    }

}


/* =========================================================
 *
 * 播放按钮
 *
 * ========================================================= */

playButton.onclick =
    async () => {

        try {

            await video.play();

            playButton.style.display =
                "none";

            loading.style.display =
                "none";

        } catch (e) {

            log(
                "播放失败：" +
                e.message,
                "error"
            );

        }

    };


/* =========================================================
 *
 * 视频事件
 *
 * ========================================================= */

video.addEventListener(
    "playing",
    () => {

        loading.style.display =
            "none";

        playButton.style.display =
            "none";

        log(
            "✓ Video 正在播放",
            "ok"
        );

    }
);


video.addEventListener(
    "waiting",
    () => {

        loading.style.display =
            "block";

        loading.textContent =
            "正在缓冲...";

    }
);


video.addEventListener(
    "canplay",
    () => {

        loading.style.display =
            "none";

    }
);


video.addEventListener(
    "ended",
    () => {

        log(
            "✓ 视频播放结束",
            "ok"
        );

    }
);


video.addEventListener(
    "error",
    () => {

        if (
            video.error
        ) {

            log(
                `Video错误：code=${video.error.code}` +
                ` message=${video.error.message || "unknown"}`,
                "error"
            );

        }

    }
);


/* =========================================================
 *
 * 按钮
 *
 * ========================================================= */

startBtn.onclick =
    () => {

        startPlayer();

    };


stopBtn.onclick =
    () => {

        stopPlayer();

    };


clearBtn.onclick =
    () => {

        clearLogs();

    };


/* =========================================================
 *
 * 初始日志
 *
 * ========================================================= */

log(
    "PNG伪装 TS HLS 播放器已启动",
    "ok"
);

log(
    "工作模式：原生H5 → hls.js → 阿里云"
);

log(
    "分片模式：PNG URL → ArrayBuffer → MPEG-TS"
);

log(
    "hls.js：Manifest 默认 Loader + Fragment 自定义 Loader"
);

log(
    "注意：.png 只是 URL 后缀，不作为媒体格式判断"
);


/* =========================================================
 *
 * 页面关闭
 *
 * ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            if (hls) {

                hls.destroy();

            }

        } catch (e) {}

    }
);

</script>
